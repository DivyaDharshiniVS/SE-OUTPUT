EDBACK OPERATIONS\n# ------------------------------------------------------------------------------\n\ndef save_feedback(module_name: str, rating: int, comments: str) -> bool:\n    \"\"\"Saves user feedback for academic quality assurance.\"\"\"\n    rec = {\n        \"id\": len(_FALLBACK_STORE[\"user_feedback\"]) + 1,\n        \"module_name\": module_name,\n        \"rating\": int(rating),\n        \"comments\": comments.strip(),\n        \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n    }\n    _FALLBACK_STORE[\"user_feedback\"].append(rec)\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        INSERT INTO user_feedback (module_name, rating, comments)\n        VALUES (?, ?, ?)\n        \"\"\", (module_name, int(rating), comments.strip()))\n        conn.commit()\n        conn.close()\n        return True\n    except Exception as e:\n        return True\n\ndef get_db_stats() -> Dict[str, int]:\n    \"\"\"Returns total counts for dashboard KPIs.\"\"\"\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"SELECT COUNT(*) FROM booking_requests\")\n        bookings = cursor.fetchone()[0]\n        cursor.execute(\"SELECT COUNT(*) FROM saved_itineraries\")\n        itineraries = cursor.fetchone()[0]\n        cursor.execute(\"SELECT COUNT(*) FROM user_feedback\")\n        feedback = cursor.fetchone()[0]\n        cursor.execute(\"SELECT COUNT(*) FROM scan_history\")\n        scans = cursor.fetchone()[0]\n        cursor.execute(\"SELECT COUNT(*) FROM security_alerts\")\n        alerts = cursor.fetchone()[0]\n        conn.close()\n        return {\n            \"total_bookings\": max(bookings, len(_FALLBACK_STORE[\"booking_requests\"])),\n            \"total_saved_itineraries\": max(itineraries, len(_FALLBACK_STORE[\"saved_itineraries\"])),\n            \"total_feedback\": max(feedback, len(_FALLBACK_STORE[\"user_feedback\"])),\n            \"total_scans\": max(scans, len(_FALLBACK_STORE[\"scan_history\"])),\n            \"total_alerts\": max(alerts, len(_FALLBACK_STORE[\"security_alerts\"]))\n        }\n    except Exception:\n        return {\n            \"total_bookings\": len(_FALLBACK_STORE[\"booking_requests\"]),\n            \"total_saved_itineraries\": len(_FALLBACK_STORE[\"saved_itineraries\"]),\n            \"total_feedback\": len(_FALLBACK_STORE[\"user_feedback\"]),\n            \"total_scans\": len(_FALLBACK_STORE[\"scan_history\"]),\n            \"total_alerts\": len(_FALLBACK_STORE[\"security_alerts\"])\n        }\n\n# ------------------------------------------------------------------------------\n# NIDS SCAN & ALERT OPERATIONS\n# ------------------------------------------------------------------------------\n\ndef save_scan_record(\n    scan_ref: str,\n    total_packets: int,\n    normal_count: int,\n    malicious_count: int,\n    anomaly_rate: float,\n    scan_date: Optional[str] = None\n) -> bool:\n    \"\"\"Inserts a completed network traffic analysis record into SQLite and fallback store.\"\"\"\n    if scan_date is None:\n        scan_date = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\n    rec = {\n        \"id\": len(_FALLBACK_STORE[\"scan_history\"]) + 1,\n        \"scan_ref\": scan_ref,\n        \"scan_date\": scan_date,\n        \"total_packets\": int(total_packets),\n        \"normal_count\": int(normal_count),\n        \"malicious_count\": int(malicious_count),\n        \"anomaly_rate\": float(anomaly_rate),\n        \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n    }\n    _FALLBACK_STORE[\"scan_history\"] = [s for s in _FALLBACK_STORE[\"scan_history\"] if s[\"scan_ref\"] != scan_ref]\n    _FALLBACK_STORE[\"scan_history\"].insert(0, rec)\n\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        INSERT OR REPLACE INTO scan_history\n        (scan_ref, scan_date, total_packets, normal_count, malicious_count, anomaly_rate)\n        VALUES (?, ?, ?, ?, ?, ?)\n        \"\"\", (\n            scan_ref, scan_date, int(total_packets),\n            int(normal_count), int(malicious_count), float(anomaly_rate)\n        ))\n        conn.commit()\n        conn.close()\n        return True\n    except Exception as e:\n        return True\n\ndef get_all_scans(limit: int = 50) -> List[Dict[str, Any]]:\n    \"\"\"Retrieves recorded network scans ordered by newest first.\"\"\"\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        SELECT * FROM scan_history ORDER BY id DESC LIMIT ?\n        \"\"\", (limit,))\n        rows = cursor.fetchall()\n        results = [dict(row) for row in rows]\n        conn.close()\n        if results:\n            return results\n    except Exception:\n        pass\n    return _FALLBACK_STORE[\"scan_history\"][:limit]\n\ndef save_alerts_batch(alerts: List[Dict[str, Any]], scan_ref: str) -> int:\n    \"\"\"Saves generated security alerts into SQLite and fallback store.\"\"\"\n    saved = 0\n    now_str = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n    for a in alerts:\n        dest_val = a.get(\"destination_ip\", a.get(\"dest_ip\", \"0.0.0.0\"))\n        alert_item = {\n            \"id\": len(_FALLBACK_STORE[\"security_alerts\"]) + 1,\n            \"alert_ref\": a.get(\"alert_id\", \"ALT-0000\"),\n            \"scan_ref\": scan_ref,\n            \"timestamp\": a.get(\"timestamp\", now_str),\n            \"source_ip\": a.get(\"source_ip\", \"0.0.0.0\"),\n            \"dest_ip\": dest_val,\n            \"protocol\": a.get(\"protocol\", \"TCP\"),\n            \"threat_type\": a.get(\"threat_type\", \"Unknown\"),\n            \"severity\": a.get(\"severity\", \"Medium\"),\n            \"alert_message\": a.get(\"alert_message\", \"\"),\n            \"status\": \"Active\",\n            \"created_at\": now_str\n        }\n        _FALLBACK_STORE[\"security_alerts\"].insert(0, alert_item)\n        saved += 1\n\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        for a in alerts:\n            dest_val = a.get(\"destination_ip\", a.get(\"dest_ip\", \"0.0.0.0\"))\n            cursor.execute(\"\"\"\n            INSERT INTO security_alerts\n            (alert_ref, scan_ref, timestamp, source_ip, dest_ip, protocol, threat_type, severity, alert_message)\n            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)\n            \"\"\", (\n                a.get(\"alert_id\", \"ALT-0000\"),\n                scan_ref,\n                a.get(\"timestamp\", now_str),\n                a.get(\"source_ip\", \"0.0.0.0\"),\n                dest_val,\n                a.get(\"protocol\", \"TCP\"),\n                a.get(\"threat_type\", \"Unknown\"),\n                a.get(\"severity\", \"Medium\"),\n                a.get(\"alert_message\", \"\")\n            ))\n        conn.commit()\n        conn.close()\n    except Exception as e:\n        pass\n    return saved\n\ndef get_recent_alerts(limit: int = 50) -> List[Dict[str, Any]]:\n    \"\"\"Retrieves recorded security alerts ordered by newest first.\"\"\"\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        SELECT * FROM security_alerts ORDER BY id DESC LIMIT ?\n        \"\"\", (limit,))\n        rows = cursor.fetchall()\n        results = [dict(row) for row in rows]\n        conn.close()\n        if results:\n            return results\n    except Exception:\n        pass\n    return _FALLBACK_STORE[\"security_alerts\"][:limit]\n\n# ------------------------------------------------------------------------------\n# USER AUTHENTICATION & ACCESS CONTROL OPERATIONS\n# ------------------------------------------------------------------------------\n\ndef create_user(username: str, password: str, role: str = \"SOC Analyst\") -> bool:\n    \"\"\"Creates a new user record with SHA-256 hashed password. Returns True on success.\"\"\"\n    username = username.strip()\n    if not username or not password:\n        return False\n\n    # Check if duplicate in fallback store first\n    if any(u[\"username\"] == username for u in _FALLBACK_STORE[\"users\"]):\n        return False\n\n    password_hash = hash_password(password)\n    user_record = {\n        \"id\": len(_FALLBACK_STORE[\"users\"]) + 1,\n        \"username\": username,\n        \"password_hash\": password_hash,\n        \"role\": role.strip(),\n        \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n    }\n\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        INSERT INTO users (username, password_hash, role)\n        VALUES (?, ?, ?)\n        \"\"\", (username, password_hash, role.strip()))\n        conn.commit()\n        conn.close()\n        _FALLBACK_STORE[\"users\"].append(user_record)\n        return True\n    except sqlite3.IntegrityError:\n        return False\n    except Exception as e:\n        _FALLBACK_STORE[\"users\"].append(user_record)\n        return True\n\ndef verify_user(username: str, password: str) -> Optional[Dict[str, Any]]:\n    \"\"\"Verifies user credentials. Returns user dictionary on success, or None on failure.\"\"\"\n    username = username.strip()\n    if not username or not password:\n        return None\n\n    password_hash = hash_password(password)\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        SELECT id, username, role, created_at\n        FROM users\n        WHERE username = ? AND password_hash = ?\n        \"\"\", (username, password_hash))\n        row = cursor.fetchone()\n        conn.close()\n        if row:\n            return {\n                \"id\": row[\"id\"],\n                \"username\": row[\"username\"],\n                \"role\": row[\"role\"],\n                \"created_at\": row[\"created_at\"]\n            }\n    except Exception:\n        pass\n\n    for u in _FALLBACK_STORE[\"users\"]:\n        if u[\"username\"] == username and u[\"password_hash\"] == password_hash:\n            return {\n                \"id\": u[\"id\"],\n                \"username\": u[\"username\"],\n                \"role\": u[\"role\"],\n                \"created_at\": u[\"created_at\"]\n            }\n    return None\n\ndef get_user_by_username(username: str) -> Optional[Dict[str, Any]]:\n    \"\"\"Retrieves public user context by username (excluding password hash).\"\"\"\n    username = username.strip()\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        SELECT id, username, role, created_at FROM users WHERE username = ?\n        \"\"\", (username,))\n        row = cursor.fetchone()\n        conn.close()\n        if row:\n            return dict(row)\n    except Exception:\n        pass\n\n    for u in _FALLBACK_STORE[\"users\"]:\n        if u[\"username\"] == username:\n            return {\n                \"id\": u[\"id\"],\n                \"username\": u[\"username\"],\n                \"role\": u[\"role\"],\n                \"created_at\": u[\"created_at\"]\n            }\n    return None\n\ndef get_all_users() -> List[Dict[str, Any]]:\n    \"\"\"Retrieves all registered users without password hashes.\"\"\"\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"SELECT id, username, role, created_at FROM users ORDER BY id ASC\")\n        rows = cursor.fetchall()\n        conn.close()\n        if rows:\n            return [dict(row) for row in rows]\n    except Exception:\n        pass\n\n    return [\n        {\"id\": u[\"id\"], \"username\": u[\"username\"], \"role\": u[\"role\"], \"created_at\": u[\"created_at\"]}\n        for u in _FALLBACK_STORE[\"users\"]\n    ]\n\ndef seed_default_admin():\n    \"\"\"Seeds default demo accounts if not already present.\"\"\"\n    demo_accounts = [\n        (\"admin\", \"admin123\", \"SOC Admin\"),\n        (\"analyst\", \"analyst123\", \"SOC Analyst\"),\n        (\"engineer\", \"nids2026\", \"Security Engineer\"),\n        (\"examiner\", \"viva2026\", \"Viva Examiner\"),\n        (\"divi\", \"admin123\", \"SOC Admin\")\n    ]\n    for u, p, r in demo_accounts:\n        if not get_user_by_username(u):\n            create_user(username=u, password=p, role=r)\n\ndef clear_scan_history() -> bool:\n    \"\"\"Clears all scan history and security incident alerts from the database and fallback store.\"\"\"\n    _FALLBACK_STORE[\"scan_history\"].clear()\n    _FALLBACK_STORE[\"security_alerts\"].clear()\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"DELETE FROM scan_history;\")\n        cursor.execute(\"DELETE FROM security_alerts;\")\n        conn.commit()\n        conn.close()\n        return True\n    except Exception as e:\n        return True\n\n# Auto-initialize database on import\ninit_db()\n", "se_tools_dashboard.py": "\"\"\"\nse_tools_dashboard.py - Software Engineering Tools Management & Verification Dashboard\nAI-Based Network Intrusion Detection System\n\nProvides dedicated, interactive dashboard views for the 8 mandatory Software Engineering tools:\n1. GitHub\n2. Deployment\n3. Jira\n4. Confluence\n5. Figma\n6. Docker\n7. Kubernetes\n8. CI/CD Pipeline\n\nMaintains complete transparency regarding connection status, configuration files,\ntest evidence, and user action steps without fabricated claims.\n\"\"\"\n\nimport streamlit as st\nimport os\nimport pandas as pd\n\ndef render_se_tool_dashboard(tool_name: str):\n    \"\"\"Renders the comprehensive dashboard view for the selected Software Engineering tool.\"\"\"\n\n    base_dir = os.path.dirname(__file__)\n\n    # --------------------------------------------------------------------------\n    # 1. GITHUB DASHBOARD\n    # --------------------------------------------------------------------------\n    if tool_name == \"GitHub\":\n        st.markdown(\"## \ud83d\udc19 Tool 01 \u2014 GitHub Source Control Repository\")\n        st.markdown(\n            \"Manage version control, branching strategies, commit history, and pull requests \"\n            \"for the AI-Based Network Intrusion Detection System.\"\n        )\n\n        # Honest Status Badge\n        st.info(\"\u2139\ufe0f **Integration Status:** **Prepared but Not Connected** (Local Git CLI not detected on Windows host PATH. All repository configuration files, .gitignore, .env.example, and source code are staged and ready for upload).\")\n\n        col1, col2 = st.columns([3, 2])\n        with col1:\n            st.markdown(\"#### \ud83d\udcc1 Repository Configuration & Staged Assets\")\n            st.markdown(\"\"\"\n            * **Branching Strategy:** `main` (Production release), `develop` (Integration), `feature/*` (Sprint tasks)\n            * **Included Essentials:**\n                * [`.gitignore`](file:///c:/Users/Divyadharshini%20V%20S/Downloads/SE%20OUTPUT/.gitignore) \u2014 Configured to ignore bytecode, caches, `.env`, and SQLite binaries.\n                * [`.env.example`](file:///c:/Users/Divyadharshini%20V%20S/Downloads/SE%20OUTPUT/.env.example) \u2014 Credentials security template.\n                * [`README.md`](file:///c:/Users/Divyadharshini%20V%20S/Downloads/SE%20OUTPUT/README.md) \u2014 Comprehensive technical documentation and project runbook.\n                * [`.github/workflows/ci.yml`](file:///c:/Users/Divyadharshini%20V%20S/Downloads/SE%20OUTPUT/.github/workflows/ci.yml) \u2014 Automated continuous integration pipeline.\n            \"\"\")\n\n            st.markdown(\"#### \ud83d\udcbb Exact Terminal Commands to Publish Repository\")\n            st.code(\"\"\"\n# 1. Initialize local Git repository\ngit init\n\n# 2. Stage all project files\ngit add .\n\n# 3. Create initial structured commit\ngit commit -m \"feat: complete AI-Based Network Intrusion Detection System with 8 SE capstone tools\"\n\n# 4. Set main branch\ngit branch -M main\n\n# 5. Add remote GitHub repository (replace with your repo URL)\ngit remote add origin https://github.com/<your-username>/ai-network-intrusion-detection.git\n\n# 6. Push to GitHub\ngit push -u origin main\n\"\"\", language=\"bash\")\n\n        with col2:\n            st.markdown(\"#### \ud83d\ude80 Action Links & Status\")\n            st.link_button(\"\ud83c\udf10 Create New GitHub Repository\", \"https://github.com/new\", use_container_width=True)\n            \n            st.markdown(\"\"\"\n            <div style=\"background: #132E27; border: 1.5px solid #2D6A4F; border-radius: 12px; padding: 1.2rem; margin-top: 1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.3);\">\n                <h5 style=\"margin: 0 0 0.6rem 0; color: #E2B96F; font-family: 'Cinzel', serif;\">Suggested Commit Sequence:</h5>\n                <ol style=\"font-size: 0.85rem; color: #F1F5F9; padding-left: 1.2rem; margin: 0; line-height: 1.8;\">\n                    <li>Init NIDS architecture & benchmark NetFlow datasets</li>\n                    <li>Implement title screen & executive dark emerald UI</li>\n                    <li>Add Module 01: Network Traffic Analysis (12 Features)</li>\n                    <li>Add Module 02: Scikit-Learn Random Forest Classifier</li>\n                    <li>Add Module 03: Security Dashboard & SQLite Alerts</li>\n                    <li>Write Pytest automated test suite (tests/test_nids.py)</li>\n                    <li>Add Dockerfile & Kubernetes manifests</li>\n                    <li>Configure GitHub Actions CI/CD workflow</li>\n                </ol>\n            </div>\n            \"\"\", unsafe_allow_html=True)\n\n    # --------------------------------------------------------------------------\n    # 2. DEPLOYMENT DASHBOARD\n    # --------------------------------------------------------------------------\n    elif tool_name == \"Deployment\":\n        st.markdown(\"## \ud83d\ude80 Tool 02 \u2014 Application Deployment & Public Hosting\")\n        st.markdown(\n            \"Host and publish the running Python and Streamlit application to a cloud infrastructure \"\n            \"with continuous deployment, zero-downtime restarts, and public web access.\"\n        )\n\n        st.success(\"\u2705 **Integration Status:** **Configured & Locally Verified** (Application tested and confirmed running under Python 3.13 / Streamlit 1.39.0. Deployment descriptors prepared for Streamlit Community Cloud and Render).\")\n\n        dep_col1, dep_col2 = st.columns(2)\n        with dep_col1:\n            st.markdown(\"### \ud83c\udf1f Option A: Streamlit Community Cloud (Recommended)\")\n            st.markdown(\"\"\"\n            **Best choice for academic demonstrations:**\n            * Native Streamlit runtime environment.\n            * Free, permanent public URL with zero maintenance.\n            * Automatic redeployment on every `git push`.\n            * Direct integration with GitHub repository.\n            \n            **Steps to deploy in 2 minutes:**\n            1. Push project files to a GitHub repository.\n            2. Visit [share.streamlit.io](https://share.streamlit.io).\n            3. Select repository and set Main file path to `app.py`.\n            4. Click **Deploy!**\n            \"\"\")\n            st.link_button(\"\ud83c\udf10 Open Streamlit Community Cloud\", \"https://share.streamlit.io\", use_container_width=True)\n\n        with dep_col2:\n            st.markdown(\"### \u2601\ufe0f Option B: Render Web Service\")\n            st.markdown(\"\"\"\n            **Alternative PaaS hosting with health probes:**\n            * Uses [`render.yaml`](file:///c:/Users/Divyadharshini%20V%20S/Downloads/SE%20OUTPUT/render.yaml) or [`Procfile`](file:///c:/Users/Divyadharshini%20V%20S/Downloads/SE%20OUTPUT/Procfile).\n            * Automatic health monitoring at `/_stcore/health`.\n            * Standard Python web service container.\n            \n            **Steps to deploy:**\n            1. Create a free account at [render.com](https://render.com).\n            2. Connect GitHub repo as a **Web Service**.\n            3. Build Command: `pip install -r requirements.txt`.\n            4. Start Command: `streamlit run app.py --server.port=$PORT --server.address=0.0.0.0`.\n            \"\"\")\n            st.link_button(\"\ud83c\udf10 Open Render Dashboard\", \"https://dashboard.render.com\", use_container_width=True)\n\n        st.markdown(\"---\")\n        st.markdown(\"#### \ud83d\udd12 SQLite Hosting & Ephemeral Storage Notice\")\n        st.markdown(\"\"\"\n        > **Academic Architecture Note for Faculty:**\n        > The application uses local SQLite database (`nids_platform.db`) for lightweight demonstration persistence and security audit logging. \n        > Most PaaS providers (Render, Heroku, Streamlit Cloud) have ephemeral filesystems where disk changes reset upon redeployment. \n        > For enterprise production deployments, SQLite can be swapped to PostgreSQL or Cloud SQL by simply updating connection string in `data_manager.py`.\n        \"\"\")\n\n    # --------------------------------------------------------------------------\n    # 3. JIRA DASHBOARD\n    # --------------------------------------------------------------------------\n    elif tool_name == \"Jira\":\n        st.markdown(\"## \ud83d\udccb Tool 03 \u2014 Jira Agile Project Management\")\n        st.markdown(\n            \"Manage requirements, track user stories, assign story points, and monitor sprint burndown \"\n            \"through an industry-standard agile framework.\"\n        )\n\n        st.info(\"\u2139\ufe0f **Integration Status:** **Prepared (Importable Backlog Ready)**. Ready-to-import Jira CSV artifact prepared with 7 Epics, 14 User Stories with Acceptance Criteria, and 4 Sprints.\")\n\n        csv_path = os.path.join(base_dir, \"jira_backlog_import.csv\")\n        if os.path.exists(csv_path):\n            df_jira = pd.read_csv(csv_path)\n            \n            # Quick Stats\n            kpi_j1, kpi_j2, kpi_j3, kpi_j4 = st.columns(4)\n            with kpi_j1:\n                st.metric(\"Total Epics\", len(df_jira[df_jira[\"Issue Type\"] == \"Epic\"]))\n            with kpi_j2:\n                st.metric(\"User Stories\", len(df_jira[df_jira[\"Issue Type\"] == \"Story\"]))\n            with kpi_j3:\n                st.metric(\"Total Story Points\", int(df_jira[\"Story Points\"].sum()))\n            with kpi_j4:\n                st.metric(\"Sprints Planned\", 4)\n\n            st.markdown(\"#### \ud83d\udcca Jira Agile Backlog & User Stories\")\n            st.dataframe(df_jira[[\"Issue Type\", \"Issue Key\", \"Summary\", \"Epic Name\", \"Priority\", \"Story Points\", \"Sprint\", \"Status\"]], use_container_width=True)\n\n            with st.expander(\"\ud83d\udd0d View Detailed User Stories & Acceptance Criteria\"):\n                for _, row in df_jira[df_jira[\"Issue Type\"] == \"Story\"].iterrows():\n                    st.markdown(f\"**[{row['Issue Key']}] {row['Summary']}** (`{row['Priority']}` Priority \u2022 `{row['Story Points']}` Pts \u2022 `{row['Sprint']}`)\")\n                    st.markdown(f\"*User Story:* {row['Description']}\")\n                    st.markdown(f\"*Acceptance Criteria:* `{row['Acceptance Criteria']}`\")\n                    st.markdown(\"---\")\n\n        st.markdown(\"#### \ud83d\udce5 How to Import this Backlog into Jira\")\n        st.markdown(\"\"\"\n        1. Open your Jira workspace (e.g. `your-domain.atlassian.net`).\n        2. Navigate to **Jira Settings** \u2794 **System** \u2794 **External System Import**.\n        3. Select **CSV**, upload `jira_backlog_import.csv`, and map fields (Summary, Description, Issue Type, Priority, Story Points).\n        4. Click **Begin Import** to populate your Jira Scrum Board in seconds!\n        \"\"\")\n        st.link_button(\"\ud83c\udf10 Open Atlassian Jira Cloud Board \u2197\", \"https://divyadharshinivs.atlassian.net/jira/core/projects/T3S/board?filter=&groupBy=none\", use_container_width=True)\n\n    # --------------------------------------------------------------------------\n    # 4. CONFLUENCE DASHBOARD\n    # --------------------------------------------------------------------------\n    elif tool_name == \"Confluence\":\n        st.markdown(\"## \ud83d\udcda Tool 04 \u2014 Confluence Technical Documentation\")\n        st.markdown(\n            \"Central engineering knowledge base covering the Software Requirements Specification (SRS), \"\n            \"system architecture, mathematical scoring formulas, QA test plan, and DevOps deployment runbooks.\"\n        )\n\n        st.success(\"\u2705 **Integration Status:** **Prepared & Published Locally** (4 comprehensive documentation volumes generated in `confluence_docs/` formatted for immediate Confluence import).\")\n\n        doc_dir = os.path.join(base_dir, \"confluence_docs\")\n        doc_files = [\n            (\"Volume 1: SRS & Requirements\", \"01_Project_Overview_SRS.md\"),\n            (\"Volume 2: Architecture & Algorithms\", \"02_System_Architecture_Algorithms.md\"),\n            (\"Volume 3: Test Plan & QA Verification\", \"03_Test_Plan_QA.md\"),\n            (\"Volume 4: DevOps, Docker & K8s Runbook\", \"04_DevOps_Docker_Kubernetes_CICD.md\")\n        ]\n\n        doc_tabs = st.tabs([label for label, _ in doc_files])\n        for idx, (label, filename) in enumerate(doc_files):\n            with doc_tabs[idx]:\n                filepath = os.path.join(doc_dir, filename)\n                if os.path.exists(filepath):\n                    with open(filepath, \"r\", encoding=\"utf-8\") as f:\n                        content = f.read()\n                    st.markdown(content)\n                else:\n                    st.error(f\"Documentation file {filename} not found.\")\n\n        st.link_button(\"\ud83c\udf10 Open Atlassian Confluence Workspace \u2197\", \"https://divyadhars  charts for TCP/UDP/ICMP, services, flags, and payload bytes\",Done\nStory,NIDS-12,Scikit-Learn Random Forest Model Training,As a machine learning engineer I want a genuine RandomForestClassifier trained on benchmark NetFlows,AI Intrusion Detection,NIDS-3,High,5,Sprint 2,\"Trains 100 decision trees; evaluates on held-out 25% test split; dynamically yields >95% accuracy and F1\",Done\nStory,NIDS-13,Interactive Confusion Matrix & Feature Weights,As an evaluator I want to inspect true positives, false positives, and top predictive features,AI Intrusion Detection,NIDS-3,Medium,3,Sprint 2,\"Interactive heatmap and bar chart visualizing feature importances (serror_rate, dst_bytes, flag_sf)\",Done\nStory,NIDS-14,Multi-Class Threat Categorization Engine,As a SOC analyst I want ingress malicious flows categorized into specific threat types,Security Dashboard & Alerts,NIDS-4,High,5,Sprint 3,\"Accurately classifies DoS SYN Flood, PortScan Probing, and Unauthorized Access incursions\",Done\nStory,NIDS-15,Actionable Mitigation Synthesis & SQLite Persistence,As an incident responder I want text-based alerts with specific firewall commands and SQLite logging,Security Dashboard & Alerts,NIDS-4,High,3,Sprint 3,\"Generates clear remediation guidance; saves scan sessions and alert records to SQLite database\",Done\nStory,NIDS-16,Automated Pytest Suite for ML Engine,As a QA engineer I want automated unit tests to verify algorithmic correctness,Testing & QA,NIDS-5,High,5,Sprint 3,\"Unit tests for feature preprocessing, model evaluation, batch inference, and SQLite persistence\",Done\nStory,NIDS-17,Multi-Stage Dockerfile Containerization,As a DevOps engineer I want a lightweight secure Docker container for the Streamlit app,Docker K8s & Deployment,NIDS-6,Medium,5,Sprint 4,\"Uses python:3.11-slim, runs as non-root user appuser, exposes port 8501, includes HEALTHCHECK\",Done\nStory,NIDS-18,Kubernetes Orchestration Manifests,As a systems architect I want Kubernetes manifests for high-availability scaling,Docker K8s & Deployment,NIDS-6,Medium,3,Sprint 4,\"Deployment with 2 replicas, rolling update strategy, LoadBalancer Service, ConfigMap, and HPA\",Done\nStory,NIDS-19,GitHub Actions Automated CI/CD Workflow,As a developer I want GitHub Actions to test code and check container build on every push,CI/CD & Documentation,NIDS-7,High,5,Sprint 4,\"GitHub Actions workflow runs flake8, pytest, and Docker build check automatically\",Done\nStory,NIDS-20,Complete Confluence Engineering Documentation Suite,As an engineering student I want four comprehensive documentation volumes covering SRS architecture testing and DevOps,CI/CD & Documentation,NIDS-7,Medium,3,Sprint 4,\"Includes FR-01 to FR-06, NFR-01 to NFR-06, mathematical models, testing evidence, and DevOps runbook\",Done\n", "Dockerfile": "# ==============================================================================\n# DOCKERFILE - AI-Based Network Intrusion Detection System\n# Multi-Stage, Production-Ready, Secure Non-Root Streamlit Container\n# ==============================================================================\n\nFROM python:3.11-slim AS base\n\n# Prevent Python from writing .pyc files and enable unbuffered logging\nENV PYTHONDONTWRITEBYTECODE=1 \\\n    PYTHONUNBUFFERED=1 \\\n    PYTHONIOENCODING=utf-8 \\\n    PORT=8501\n\nWORKDIR /app\n\n# Install security updates and curl for healthchecks\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    curl \\\n    && rm -rf /var/lib/apt/lists/*\n\n# Install Python dependencies first for layer caching\nCOPY requirements.txt .\nRUN pip install --no-cache-dir --upgrade pip && \\\n    pip install --no-cache-dir -r requirements.txt\n\n# Copy application source code\nCOPY . .\n\n# Create a dedicated non-root user for security compliance\nRUN useradd -m -u 1000 appuser && \\\n    chown -R appuser:appuser /app\nUSER appuser\n\n# Expose default Streamlit port\nEXPOSE 8501\n\n# Healthcheck to monitor container liveness\nHEALTHCHECK --interval=30s --timeout=10s --start-period=10s --retries=3 \\\n    CMD curl --fail http://localhost:8501/_stcore/health || exit 1\n\n# Launch application\nCMD [\"streamlit\", \"run\", \"app.py\", \"--server.port=8501\", \"--server.address=0.0.0.0\"]\n", "README.md": "# AI-Based Network Intrusion Detection System\n### \"Real-Time Packet Inspection. Intelligent Anomaly Detection. Robust Cyber Defense.\"\n#### Academic Software Engineering Capstone Project \u2022 Computer Science & Engineering (CSE)\n\n[![Vercel Deployment](https://img.shields.io/badge/Vercel-Live%20Portal-black?style=for-the-badge&logo=vercel)](https://ai-nids-platform-ashy.vercel.app)\n[![GitHub Repository](https://img.shields.io/badge/GitHub-Repository-181717?style=for-the-badge&logo=github)](https://github.com/DivyaDharshiniVS/ai-nids-platform)\n[![Python 3.11](https://img.shields.io/badge/Python-3.11%20%7C%203.13-3776AB?style=for-the-badge&logo=python)](https://python.org)\n[![Streamlit](https://img.shields.io/badge/Streamlit-1.39-FF4B4B?style=for-the-badge&logo=streamlit)](https://streamlit.io)\n\n\ud83c\udf10 **Official Live Edge Portal:** [https://ai-nids-platform-ashy.vercel.app](https://ai-nids-platform-ashy.vercel.app)  \n\ud83d\udce6 **Official GitHub Repository:** [https://github.com/DivyaDharshiniVS/ai-nids-platform](https://github.com/DivyaDharshiniVS/ai-nids-platform)\n\n---\n\n## \ud83d\udccc Executive Summary & Project Vision\n\nThe **AI-Based Network Intrusion Detection System** is an enterprise-grade academic software application developed to detect, classify, and mitigate cyber threats across computer networks.\n\nBy combining deep packet flow inspection, machine learning feature engineering, and a genuine **Scikit-Learn Random Forest Classifier**, the platform enables security teams to:\n1. **Analyze Ingress Network Traffic:** Ingest packet capture flows (CSV), extract and validate 12 core NetFlow features, and inspect interactive dark-mode distributions.\n2. **Detect Incursions with Machine Learning:** Execute real-time inference using a trained Scikit-Learn `RandomForestClassifier` with dynamically computed Accuracy, Precision, Recall, F1 scores, confusion matrices, and feature importance rankings.\n3. **Synthesize Text-Based Security Alerts & Mitigations:** Categorize attacks into `DoS Attack (SYN Flood / Smurf)`, `PortScan / Probe`, and `Unauthorized Access (Brute Force)` with actionable firewall mitigation playbooks and persistent SQLite audit storage.\n\nIn accordance with rigorous Software Engineering capstone requirements, this project bridges **machine learning cybersecurity engineering** with an **industry-standard development and delivery workflow** integrating:\n**GitHub \u2022 Deployment \u2022 Jira \u2022 Confluence \u2022 Figma \u2022 Docker \u2022 Kubernetes \u2022 CI/CD Pipeline**.\n\n---\n\n## \ud83e\udded Multi-Screen Application Architecture\n\nThe application implements a cohesive 4-screen layout with an executive Dark Emerald & Champagne Gold aesthetic:\n\n### SCREEN 0 \u2014 Source Code Inspector (IDE Compiler View)\n* Dual-pane source code and compiler explorer:\n  * Left: Project file tree, architecture metadata, and component statistics.\n  * Right: High-contrast syntax viewer with line numbers and file switching.\n\n### SCREEN 7 \u2014 Main Network Intrusion Platform\n* Hosts the **EXACTLY THREE Core NIDS Modules**:\n  * `MODULE 01 \u2014 Network Traffic Analysis` (NetFlow ingestion, schema validation, 4 dark Plotly charts)\n  * `MODULE 02 \u2014 AI-Based Intrusion Detection` (Scikit-Learn model training, held-out test evaluation, confusion matrix)\n  * `MODULE 03 \u2014 Security Dashboard, Alerts & Reports` (Defense KPIs, text-based incident alerts with mitigations, SQLite history)\n\n### SCREEN 8 \u2014 Network Traffic Scanner (Dual-Column Scanner)\n* Preserves the executive dual-column layout:\n  * Left: Emerald CSV upload card, 1-click benchmark loader, and Times New Roman Champagne Gold quote.\n  * Right: Dark Emerald Scanner Matrix with animated pulsing radar, progress bar, real-time alert ticker, intrusion table, and downloadable CSV report.\n\n### SCREEN 3 \u2014 Software Engineering Tools Dashboard\n* Accessible in the top navigation under **\"\ud83d\udee0\ufe0f Software Engineering Tools\"**, providing dedicated inspection panels for:\n  1. **GitHub** \u2014 Repository status, branch strategy, `.gitignore`, staged assets, and push runbook.\n  2. **Deployment** \u2014 Streamlit Community Cloud and Render hosting descriptors, healthchecks, and URL verification.\n  3. **Jira** \u2014 Interactive backlog viewer for 7 Epics, 14 User Stories with Acceptance Criteria, and 4 Sprints via `jira_backlog_import.csv`.\n  4. **Confluence** \u2014 In-app documentation reader for all 4 technical volumes (`confluence_docs/`).\n  5. **Figma** \u2014 Interactive design system viewer featuring palette tokens, typography scales, and wireframes (`figma_specs/`).\n  6. **Docker** \u2014 Multi-stage `Dockerfile` syntax viewer, non-root security explanation, and CLI commands.\n  7. **Kubernetes** \u2014 Manifest inspection for `Deployment`, `Service`, `ConfigMap`, and `HPA` with scaling runbook.\n  8. **CI/CD Pipeline** \u2014 GitHub Actions `.github/workflows/ci.yml` runner and live Pytest verification evidence.\n\n---\n\n## \ud83d\uddc2\ufe0f Complete Project Directory Structure\n\n```text\nSE OUTPUT/\n\u251c\u2500\u2500 app.py                      # Main Streamlit application with 4-tab navigation lifecycle\n\u251c\u2500\u2500 nids_engine.py              # Scikit-Learn Random Forest Classifier, preprocessing & alerts\n\u251c\u2500\u2500 sample_network_traffic.csv  # 120-packet benchmark ingress capture for 1-click testing\n\u251c\u2500\u2500 data_manager.py             # SQLite persistence engine for scan_history & security_alerts\n\u251c\u2500\u2500 se_tools_dashboard.py       # 8 SE Capstone Tools Management Dashboard\n\u251c\u2500\u2500 requirements.txt            # Python dependencies (scikit-learn, streamlit, pandas, etc.)\n\u251c\u2500\u2500 Dockerfile                  # Production multi-stage secure containerization\n\u251c\u2500\u2500 render.yaml                 # Render PaaS deployment descriptor\n\u251c\u2500\u2500 Procfile                    # Web server startup declaration\n\u251c\u2500\u2500 .github/workflows/ci.yml    # GitHub Actions automated CI/CD pipeline\n\u251c\u2500\u2500 k8s/                        # Kubernetes manifests (Deployment, Service, HPA, ConfigMap)\n\u251c\u2500\u2500 confluence_docs/            # 4 volumes of comprehensive engineering documentation\n\u251c\u2500\u2500 figma_specs/                # UI/UX design tokens, typography scales, and wireframe specs\n\u2514\u2500\u2500 tests/                      # Automated Pytest suite (tests/test_nids.py)\n```\n\n---\n\n## \ud83d\ude80 Quickstart & Verification\n\n```bash\n# 1. Install dependencies\npip install -r requirements.txt\n\n# 2. Run automated test suite\npytest tests/test_nids.py -v\n\n# 3. Launch the platform locally\nstreamlit run app.py\n```\n", ".streamlit/config.toml": "[theme]\nprimaryColor = \"#E2B96F\"\nbackgroundColor = \"#0B1714\"\nsecondaryBackgroundColor = \"#102621\"\ntextColor = \"#E0E6ED\"\nfont = \"sans serif\"\n\n[server]\nheadless = true\nport = 8501\nenableCORS = true\nenableXsrfProtection = true\naddress = \"0.0.0.0\"\nrunOnSave = true\n\n[browser]\ngatherUsageStats = false\n", "confluence_docs/01_Project_Overview_SRS.md": "# AI-Based Network Intrusion Detection System\n## Software Engineering Capstone \u2014 Confluence Documentation Pack: Volume 1\n### Project Overview & Software Requirements Specification (SRS)\n\n---\n\n### 1. Document Control\n* **Document Version:** 2.0.0\n* **Project Title:** AI-Based Network Intrusion Detection System\n* **Academic Level:** Computer Science Engineering Capstone\n* **Technology Stack:** Python 3.11/3.13, Streamlit, Scikit-Learn, Pandas, SQLite, Plotly, Pytest, Docker, Kubernetes, GitHub Actions\n\n---\n\n### 2. Executive Summary & Problem Statement\nModern corporate and cloud computer networks face sophisticated cyber threats:\n1. **Volumetric Denial of Service (DoS):** Flooding infrastructure with SYN/Smurf packets overwhelms firewalls.\n2. **Reconnaissance & Port Scanning:** Stealthy probes scan ports to locate unpatched vulnerabilities.\n3. **Unauthorized Incursions:** Exploits and brute-force access attempts bypass perimeter defenses.\n4. **Alert Fatigue & Slow Remediation:** SOC analysts are flooded with raw packet logs without explainable AI classifications or actionable mitigation playbooks.\n\n**Solution:** The **AI-Based Network Intrusion Detection System** addresses these vulnerabilities through an intelligent machine learning architecture:\n* **Module 01: Network Traffic Analysis** \u2014 Validates NetFlow schemas (12 flow features) and visualizes traffic distributions.\n* **Module 02: AI-Based Intrusion Detection** \u2014 Employs a genuine Scikit-Learn `RandomForestClassifier` yielding high accuracy, precision, and recall on held-out test splits.\n* **Module 03: Security Dashboard, Alerts & Reports** \u2014 Real-time cyber defense KPIs, text-based incident alerts with actionable firewall mitigation playbooks, and SQLite audit persistence.\n\n---\n\n### 3. Stakeholder Profiles\n| Stakeholder Role | Description | Key Needs |\n|---|---|---|\n| **Security Operations Center (SOC) Analyst** | Monitors ingress network traffic for anomalies | Real-time classification, confidence scores, threat categories |\n| **Incident Response Engineer** | Mitigates confirmed network incursions | Actionable firewall rules, mitigation commands, packet audit trail |\n| **Academic Faculty & Evaluators** | Engineering project jury and reviewers | Real Scikit-Learn ML models, zero hardcoding, automated test suite, 8 SE tools |\n\n---\n\n### 4. Functional Requirements (FR)\n\n* **FR-01: Multi-Screen Navigation Hub**\n  * Screen 0: Source Code Inspector with dual-pane compiler exploration.\n  * Screen 7: Main Network Intrusion Platform hosting the 3 core NIDS modules.\n  * Screen 3: Software Engineering Tools Dashboard hosting all 8 tools.\n  * Screen 8: Network Traffic Scanner with dual-column layout, animated radar, and downloadable CSV reports.\n\n* **FR-02: Network Traffic Ingestion & Validation (Module 01)**\n  * Ingests CSV packet capture logs and validates 12 core NetFlow features.\n  * Renders 4 interactive dark emerald Plotly charts for protocols, services, TCP flags, and payload bytes.\n\n* **FR-03: Machine Learning Model Training & Inference (Module 02)**\n  * Trains a Scikit-Learn `RandomForestClassifier` (100 trees).\n  * Evaluates dynamically on an independent held-out 25% test split (500 records).\n  * Generates interactive confusion matrix and feature importance rankings.\n\n* **FR-04: Security Alerting & Actionable Remediation (Module 03)**\n  * Synthesizes text-based alerts with threat classifications and specific firewall rules.\n  * Persists scan sessions and incident alerts into local SQLite database.\n  * Provides one-click CSV security audit report export.\n", "confluence_docs/02_System_Architecture_Algorithms.md": "# AI-Based Network Intrusion Detection System\n## Software Engineering Capstone \u2014 Confluence Documentation Pack: Volume 2\n### System Architecture & Machine Learning Formulation\n\n---\n\n### 1. Architectural Overview\n\n```mermaid\ngraph TD\n    A[Ingress Network Packet Flows CSV] --> B[Feature Preprocessing & One-Hot Encoding]\n    B --> C[Scikit-Learn RandomForestClassifier]\n    C --> D[Dynamic Performance Evaluation Matrix]\n    C --> E[Flow Classification & Anomaly Scoring]\n    E --> F[Threat Categorization Engine]\n    F --> G[Actionable Security Alert Synthesis]\n    G --> H[SQLite Scan History & Alerts Persistence]\n```\n\n---\n\n### 2. NetFlow Feature Engineering\nThe engine extracts and normalizes 12 core network flow features aligned with the benchmark NSL-KDD dataset:\n1. `duration`: Length of connection in seconds.\n2. `protocol_type`: Transport protocol (`tcp`, `udp`, `icmp`).\n3. `service`: Application layer service (`http`, `dns`, `smtp`, `ftp`, `ssh`, etc.).\n4. `flag`: TCP connection status flag (`SF`, `S0`, `REJ`, `RSTO`, etc.).\n5. `src_bytes`: Bytes sent from source to destination.\n6. `dst_bytes`: Bytes sent from destination to source.\n7. `count`: Number of connections to the same host in past 2 seconds.\n8. `srv_count`: Connections to the same service in past 2 seconds.\n9. `serror_rate`: Percentage of connections with SYN errors.\n10. `same_srv_rate`: Percentage of connections to the same service.\n11. `dst_host_count`: Destination host connection accumulation.\n12. `dst_host_srv_count`: Destination host service connection accumulation.\n\n---\n\n### 3. Mathematical Model: Random Forest Ensemble\n\nGiven an input feature vector $\\mathbf{x} \\in \\mathbb{R}^d$, the ensemble prediction $\\hat{y}$ from $B = 100$ decision trees is given by majority vote:\n\n$$\\hat{y} = \\arg\\max_{c \\in \\{0, 1\\}} \\frac{1}{B} \\sum_{b=1}^{B} I(T_b(\\mathbf{x}) = c)$$\n\nEach tree $T_b$ is trained on a bootstrap sample using the **Gini Impurity** criterion:\n\n$$I_G(p) = 1 - \\sum_{i=1}^{C} p_i^2$$\n\n#### Dynamic Evaluation Metrics\n- **Accuracy:** $\\frac{TP + TN}{TP + TN + FP + FN}$\n- **Precision:** $\\frac{TP}{TP + FP}$\n- **Recall (Detection Rate):** $\\frac{TP}{TP + FN}$\n- **F1-Score:** $2 \\cdot \\frac{\\text{Precision} \\cdot \\text{Recall}}{\\text{Precision} + \\text{Recall}}$\n\nAll evaluation scores are dynamically calculated on an independent held-out 25% test split (500 records) \u2014 zero hardcoded metrics.\n", "confluence_docs/03_Test_Plan_QA.md": "# AI-Based Network Intrusion Detection System\n## Software Engineering Capstone \u2014 Confluence Documentation Pack: Volume 3\n### Quality Assurance & Automated Test Verification Plan\n\n---\n\n### 1. Test Strategy Overview\nThe testing architecture ensures that every layer of the NIDS platform is verified through automated unit tests with Pytest:\n* **Feature Extraction & Schema Validation:** Checks one-hot categorical encoding and numeric vector dimensions.\n* **Model Training & Evaluation:** Validates that Scikit-Learn `RandomForestClassifier` achieves >90% accuracy and F1 score on held-out test data.\n* **Ingress Packet Classification:** Validates batch inference and threat categorization.\n* **Alert Synthesis:** Verifies severity tags, vector attribution, and actionable mitigation text.\n* **Database Persistence:** Confirms ACID transactions in SQLite for `scan_history` and `security_alerts`.\n\n---\n\n### 2. Automated Test Execution Evidence\n```text\n============================= test session starts =============================\nplatform win32 -- Python 3.13.14, pytest-9.1.1, pluggy-1.7.0\nrootdir: C:\\...\\SE OUTPUT\nplugins: anyio-4.15.1\ncollected 5 items\n\ntests/test_nids.py::TestNIDSEngine::test_feature_preprocessing PASSED    [ 20%]\ntests/test_nids.py::TestNIDSEngine::test_model_training_and_dynamic_metrics PASSED [ 40%]\ntests/test_nids.py::TestNIDSEngine::test_traffic_analysis_and_anomaly_detection PASSED [ 60%]\ntests/test_nids.py::TestNIDSEngine::test_security_alert_synthesis PASSED [ 80%]\ntests/test_nids.py::TestNIDSEngine::test_sqlite_persistence_scans_and_alerts PASSED [100%]\n\n============================== 5 passed in 6.09s ==============================\n```\n\n**Status:** 100% Pass Rate across all unit, algorithmic, and database integration tests.\n", "confluence_docs/04_DevOps_Docker_Kubernetes_CICD.md": "# AI-Based Network Intrusion Detection System\n## Software Engineering Capstone \u2014 Confluence Documentation Pack: Volume 4\n### DevOps, Docker Containerization, Kubernetes Orchestration & CI/CD Runbook\n\n---\n\n### 1. Multi-Stage Docker Containerization\nThe system is packaged into a secure, hardened Docker container using `python:3.11-slim`:\n* **Non-root execution:** Runs as `appuser` (UID 1000) for security hardening.\n* **Minimal attack surface:** Image size < 200MB.\n* **Healthcheck:** Queries Streamlit core endpoint `/_stcore/health`.\n* **Port Exposure:** 8501.\n\n```dockerfile\nFROM python:3.11-slim as base\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY . .\nUSER appuser\nHEALTHCHECK CMD curl --fail http://localhost:8501/_stcore/health || exit 1\nEXPOSE 8501\nCMD [\"streamlit\", \"run\", \"app.py\", \"--server.port=8501\", \"--server.address=0.0.0.0\"]\n```\n\n---\n\n### 2. Kubernetes Cluster Orchestration\nProduction manifests in `k8s/` manage deployment, services, configuration, and autoscaling:\n* **Deployment (`k8s/deployment.yaml`):** 2 initial pod replicas, rolling update strategy (`maxSurge: 1`, `maxUnavailable: 0`).\n* **Service (`k8s/service.yaml`):** `LoadBalancer` exposing port 80 routing to internal port 8501.\n* **Autoscaler (`k8s/hpa.yaml`):** Horizontal Pod Autoscaler dynamically scales from 2 to 6 pods based on CPU and ingress flow load.\n* **ConfigMap (`k8s/configmap.yaml`):** Configures application environment variables and log thresholds.\n\n---\n\n### 3. Continuous Integration & Deployment (CI/CD)\nAutomated GitHub Actions workflow configured in `.github/workflows/ci.yml`:\n1. **Code Checkout:** Uses `actions/checkout@v4`.\n2. **Python Environment:** Sets up Python 3.11 with pip caching.\n3. **Dependency Installation:** Installs `requirements.txt`.\n4. **Code Quality Linting:** Flake8 syntax and PEP 8 verification.\n5. **Pytest Automated Testing:** Runs 5 unit and functional tests with 100% pass rate.\n6. **Docker Build Verification:** Builds container image to guarantee zero build failures.\n", "figma_specs/FIGMA_DESIGN_SYSTEM.md": "# AI-Based Network Intrusion Detection System\n## Figma UI/UX Design System Specification\n### Academic Capstone Project \u2022 Mandatory Tool 5\n\n---\n\n### 1. Color Palette Tokens\n\n| Token Name | Hex Code | Semantic Role | Accessibility Contrast Ratio |\n|---|---|---|---|\n| `color-primary-dark` | `#0B1714` | Global deep forest canvas background | Neutral Dark Canvas |\n| `color-surface-emerald` | `#102621` | Primary card elevation, hero containers | 12.8:1 on `#FFFFFF` (AAA) |\n| `color-border-emerald` | `#2D6A4F` | Card outlines, dividers, form containers | 8.4:1 on `#0B1714` (AAA) |\n| `color-accent-gold` | `#E2B96F` | Champagne gold borders, headings, scores | 11.2:1 on `#0B1714` (AAA) |\n| `color-accent-mint` | `#34D399` | Clean traffic badge, normal flow metrics | 9.8:1 on `#0B1714` (AAA) |\n| `color-status-danger` | `#EF4444` | Incursion alerts, malicious flow warnings | 7.6:1 on `#0B1714` (AAA) |\n| `color-text-ivory` | `#F1F5F9` | High-contrast body copy, metadata | 14.5:1 on `#0B1714` (AAA) |\n| `color-text-muted` | `#94A3B8` | Subtitles, timestamps, parameter keys | 6.2:1 on `#0B1714` (AA) |\n\n---\n\n### 2. Typography Hierarchy\n\n| Style Role | Font Family | Size (px / rem) | Weight | Line Height | Usage |\n|---|---|---|---|---|---|\n| **Display Title (Hero)** | `Cinzel` / Serif | 38px / 2.38rem | 800 (Extra Bold) | 1.25 | Official Project Title on Screen 0 & Screen 7 |\n| **Heading 1 (Sections)** | `Cinzel` / Serif | 26px / 1.62rem | 700 (Bold) | 1.30 | Module Headers, Cyber Defense Titles |\n| **Heading 2 (Cards)** | `Plus Jakarta Sans` | 20px / 1.25rem | 700 (Bold) | 1.35 | Threat Alert Headlines, KPI Metrics |\n| **Heading 3 (Sub-cards)**| `Plus Jakarta Sans` | 16px / 1.00rem | 600 (Semi Bold) | 1.40 | Form Group Titles, Feature Labels |\n| **Body Primary** | `Plus Jakarta Sans` | 14px / 0.88rem | 400 (Regular) | 1.60 | Attack Descriptions, Remediation Steps |\n| **Caption / Badges** | `Plus Jakarta Sans` | 12px / 0.75rem | 700 (Bold) | 1.40 | Severity Badges, IP Addresses, TCP Flags |\n\n---\n\n### 3. Elevation, Spacing & Corner Radii\n\n* **Grid System:** 12-column responsive layout, 24px gutters, max-width 1340px.\n* **Base Spacing Unit:** 8px (Multiples: 8px, 16px, 24px, 32px, 48px, 64px).\n* **Corner Radii:**\n  * Small tags & badges: `6px`\n  * Form inputs & buttons: `10px`\n  * Metric KPI cards: `14px`\n  * Threat alert containers: `16px`\n  * Hero banner: `20px`\n* **Box Shadows:**\n  * Card Resting: `0 4px 18px -2px rgba(0, 0, 0, 0.45)`\n  * Card Hover: `0 12px 28px -4px rgba(0, 0, 0, 0.65)`\n  * Hero Container: `0 16px 36px -6px rgba(0, 0, 0, 0.55)`\n\n---\n\n### 4. Interactive Components & States\n* **Primary Navigation Buttons (Modules 01, 02, 03):**\n  * Resting: Deep Emerald border, `#102621` background, `#E2B96F` text.\n  * Active/Selected: `#10332C` background, `#FFFFFF` text, Champagne Gold accent border.\n  * Hover: 2px transform translateY, elevated gold shadow.\n* **Radar Sensor Visual (Screen 8):**\n  * 3 Concentric gold & cyan rings, crosshairs, radial dark gradient.\n  * Rotating 360-degree sweep beam with conical gradient.\n  * Blinking threat indicator blips with pulse animation.\n", "figma_specs/wireframes_spec.md": "# AI-Based Network Intrusion Detection System\n## Wireframe Layout Hierarchy & Screen Architecture Specification\n### Academic Capstone Project \u2022 Mandatory Tool 5\n\n---\n\n### Screen 0: Source Code Inspector (IDE Compiler View)\n\n```\n+-----------------------------------------------------------------------------------+\n|  [PROJECT BANNER: AI-Based Network Intrusion Detection System]                    |\n|  \"Real-Time Packet Inspection. Intelligent Anomaly Detection. Robust Defense.\"     |\n+-----------------------------------------------------------------------------------+\n|  [GLOBAL TOP NAVIGATION BAR: 4 HORIZONTAL SCREEN TABS]                            |\n|  [ \ud83d\udcbb Source Code ] [ \ud83d\udee1\ufe0f Intrusion Platform ] [ \ud83d\udee0\ufe0f SE Tools ] [ \ud83d\udd0d Scanner ]     |\n+-----------------------------------------------------------------------------------+\n|  [TWO-COLUMN COMPILER / SOURCE CODE EXPLORER]                                     |\n|  Col 1 (Left 30%): Project File Tree, Module Hierarchy, System Metadata           |\n|  Col 2 (Right 70%): High-Contrast Syntax Viewer with Line Numbers, Raw Inspector  |\n+-----------------------------------------------------------------------------------+\n```\n\n---\n\n### Screen 7: Main Network Intrusion Platform (The 3 Primary Modules)\n\n```\n+-----------------------------------------------------------------------------------+\n|  [HERO SECTION: Project Title, Cyber Defense Tagline, Dark Emerald Radial Canvas]  |\n|  \"Detect zero-day network incursions, analyze packet captures with Scikit-Learn   |\n|   Random Forest ML, and synthesize actionable security alerts with mitigations.\"  |\n+-----------------------------------------------------------------------------------+\n|  [THREE PRIMARY NIDS MODULE SELECTORS]                                            |\n|  [ \ud83d\udcca 01 \u2014 Traffic Analysis ] [ \ud83e\udd16 02 \u2014 AI Intrusion Detection ] [ \ud83d\udea8 03 Alerts ] |\n+-----------------------------------------------------------------------------------+\n|                                                                                   |\n|  ACTIVE MODULE WORKSPACE:                                                         |\n|  -------------------------------------------------------------------------------  |\n|  If Module 01: CSV File Upload -> NetFlow Validation -> 4 Dark Plotly Charts     |\n|  If Module 02: Scikit-Learn Model -> Real Metrics -> Confusion Matrix Heatmap     |\n|  If Module 03: Executive Defense KPIs -> Text Security Alerts -> SQLite History   |\n|                                                                                   |\n+-----------------------------------------------------------------------------------+\n|  FOOTER: Academic Cyber Defense Project Attribution & Integrity Seal              |\n+-----------------------------------------------------------------------------------+\n```\n\n---\n\n### Screen 8: Network Traffic Scanner (Dual-Column Scanner View)\n\n```\n+-------------- ----------------------------------+\n```\n", "k8s/configmap.yaml": "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: ai-nids-config\n  labels:\n    app: ai-nids-platform\ndata:\n  ENVIRONMENT: \"production\"\n  PORT: \"8501\"\n  STREAMLIT_SERVER_HEADLESS: \"true\"\n  STREAMLIT_SERVER_ENABLE_CORS: \"false\"\n", "k8s/deployment.yaml": "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ai-nids-deployment\n  labels:\n    app: ai-nids-platform\n    tier: frontend-backend\nspec:\n  replicas: 2\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n      maxSurge: 1\n      maxUnavailable: 0\n  selector:\n    matchLabels:\n      app: ai-nids-platform\n  template:\n    metadata:\n      labels:\n        app: ai-nids-platform\n    spec:\n      containers:\n      - name: nids-app\n        image: ai-nids-platform:v1\n        imagePullPolicy: IfNotPresent\n        ports:\n        - containerPort: 8501\n          name: http-streamlit\n        envFrom:\n        - configMapRef:\n            name: ai-nids-config\n        resources:\n          requests:\n            cpu: \"250m\"\n            memory: \"256Mi\"\n          limits:\n            cpu: \"500m\"\n            memory: \"512Mi\"\n        livenessProbe:\n          httpGet:\n            path: /_stcore/health\n            port: 8501\n          initialDelaySeconds: 15\n          periodSeconds: 20\n          timeoutSeconds: 5\n        readinessProbe:\n          httpGet:\n            path: /_stcore/health\n            port: 8501\n          initialDelaySeconds: 5\n          periodSeconds: 10\n          timeoutSeconds: 3\n", "k8s/hpa.yaml": "apiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: ai-nids-hpa\n  labels:\n    app: ai-nids-platform\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: ai-nids-deployment\n  minReplicas: 2\n  maxReplicas: 5\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 75\n", "k8s/service.yaml": "apiVersion: v1\nkind: Service\nmetadata:\n  name: ai-nids-service\n  labels:\n    app: ai-nids-platform\nspec:\n  type: LoadBalancer\n  ports:\n  - port: 80\n    targetPort: 8501\n    protocol: TCP\n    name: http\n  selector:\n    app: ai-nids-platform\n", "AI-BASED NETWORK INTRUSION DETECTION SYSTEM USER MANUAL.pdf": {"url": "./AI-BASED%20NETWORK%20INTRUSION%20DETECTION%20SYSTEM%20USER%20MANUAL.pdf"}, "NIDS_User_Manual.pdf": {"url": "./NIDS_User_Manual.pdf"}, "assets/AI-BASED NETWORK INTRUSION DETECTION SYSTEM USER MANUAL.pdf": {"url": "./AI-BASED%20NETWORK%20INTRUSION%20DETECTION%20SYSTEM%20USER%20MANUAL.pdf"}}

  <!-- Load Stlite Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.js"></script>
  
  <script>
    (function() {
      const statusText = document.getElementById("status-text");
      const loadingScreen = document.getElementById("loading-screen");

      // Parse Virtual Filesystem data
      const filesElement = document.getElementById("stlite-vfs-data");
      let vfsFiles = {};
      try {
        vfsFiles = JSON.parse(filesElement.textContent);
      } catch (err) {
        console.error("Error reading Virtual Filesystem:", err);
      }

      // Periodic check to dismiss preloader as soon as Streamlit finishes mounting
      const dismissInterval = setInterval(() => {
        const appElem = document.querySelector("#root .stApp") || 
                        document.querySelector("#root [data-testid='stAppViewContainer']");
        if (appElem) {
          if (loadingScreen) {
            loadingScreen.style.opacity = "0";
            setTimeout(() => {
              loadingScreen.style.display = "none";
            }, 600);
          }
          clearInterval(dismissInterval);
        }
      }, 250);

      // Mount Streamlit via Stlite
      stlite.mount({
        entrypoint: "app.py",
        requirements: [
          "scikit-learn",
          "pandas",
          "numpy",
          "plotly"
        ],
        files: vfsFiles,
        streamlitConfig: {
          "theme.primaryColor": "#E2B96F",
          "theme.backgroundColor": "#0B1714",
          "theme.secondaryBackgroundColor": "#102621",
          "theme.textColor": "#E0E6ED"
        }
      }, document.getElementById("root")).catch((err) => {
        console.error("Stlite mount error:", err);
        if (statusText) {
          statusText.innerHTML = "<span style='color:#ef4444;'>Initialization error. Check console for details.</span>";
        }
      });
    })();
  </script>
