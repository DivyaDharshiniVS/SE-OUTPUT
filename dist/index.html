ont-weight: 800; color: #34D399; line-height: 1;\">{conf_val}%</div>\n                    <div style=\"font-size: 0.75rem; color: #A7F3D0; text-transform: uppercase; font-weight: 700; margin-top: 4px;\">Normal Confidence</div>\n                </div>\n            </div>\n            \"\"\", unsafe_allow_html=True)\n\n        # 3 Real-Time Evaluation Metrics in Columns\n        m_col1, m_col2, m_col3 = st.columns(3)\n        with m_col1:\n            st.metric(\n                \"Classification Verdict\",\n                \"MALICIOUS\" if is_mal else \"NORMAL\",\n                delta=\"Threat Detected\" if is_mal else \"Verified Secure\",\n                delta_color=\"inverse\" if is_mal else \"normal\"\n            )\n        with m_col2:\n            st.metric(\"Threat Category\", threat_cat, f\"Severity: {live_res['severity']}\")\n        with m_col3:\n            st.metric(\"Model Confidence\", f\"{conf_val}%\", \"predict_proba output\")\n\n        st.markdown(\"<div style='height: 12px;'></div>\", unsafe_allow_html=True)\n\n        # Interactive Protocol & Traffic Explanation Box\n        st.markdown(f\"\"\"\n        <div style=\"background: #132E27; border: 1.5px solid #2D6A4F; border-radius: 14px; padding: 1.4rem 1.6rem; margin-bottom: 1.4rem; box-shadow: 0 6px 20px rgba(0,0,0,0.35);\">\n            <div style=\"margin-bottom: 1rem; border-bottom: 1px solid #1A3C34; padding-bottom: 0.6rem;\">\n                <span style=\"font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 800; color: #E2B96F; letter-spacing: 0.03em;\">\n                    \ud83d\udcd6 Protocol & Traffic Explanation Deep Dive\n                </span>\n            </div>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.1rem;\">\n                <div style=\"background: #0D2320; border: 1px solid #1A3C34; border-radius: 10px; padding: 1rem 1.2rem;\">\n                    <div style=\"font-size: 0.85rem; font-weight: 700; color: n display_df.head(15).iterrows():\n            is_mal = (r[\"predicted_label\"] == \"Malicious\")\n            status_badge = (\n                f\"<span style='background: #7F1D1D; color: #FECACA; border: 1px solid #DC2626; padding: 2px 8px; border-radius: 4px; font-weight: 700;'>\ud83d\udea8 MALICIOUS</span>\"\n                if is_mal else\n                f\"<span style='background: #064E3B; color: #A7F3D0; border: 1px solid #10B981; padding: 2px 8px; border-radius: 4px; font-weight: 700;'>\u2705 NORMAL</span>\"\n            )\n            conf_color = \"#EF4444\" if is_mal else \"#22C55E\"\n            cat_text = f\"<strong style='color: #FBBF24;'>{r['threat_category']}</strong>\" if is_mal else \"<span style='color: #94A3B8;'>Normal Flow</span>\"\n\n            t_rows.append([\n                f\"<strong style='color: #E2B96F;'>FLW-{idx+1:04d}</strong>\",\n                str(r.get(\"src_ip\", \"192.168.1.10\")),\n                str(r.get(\"dst_ip\", \"10.0.0.1\")),\n                f\"<span style='background: #0D2320; color: #5EEAD4; padding: 2px 6px; border-radius: 4px; font-weight: 700;'>{str(r.get('protocol_type', 'tcp')).upper()}</span>\",\n                str(r.get(\"service\", \"http\")),\n                f\"<span style='color: {'#22C55E' if r.get('flag')=='SF' else '#EF4444'}; font-weight: 700;'>{str(r.get('flag', 'SF'))}</span>\",\n                f\"<strong style='color: {conf_color};'>{r['anomaly_confidence']}%</strong>\",\n                status_badge,\n                cat_text\n            ])\n        render_contrast_table(t_headers, t_rows, align_right_indices=[6])\n\n    # --------------------------------------------------------------------------\n    # MODULE 03: SECURITY DASHBOARD, ALERTS & REPORTS\n    # --------------------------------------------------------------------------\n    elif st.session_state.active_module == \"security_dashboard\":\n        st.markdown(\"### \ud83d\udea8 MODULE 03 \u2014 Security Dashboard, Alerts & Reports\")\n        st.markdown(\n            \"<p style='color: #e0e6ed; margin-top: -0.5rem;'>\"\n            \"Executive cyber defense overview, text-based security incident alerts with recommended mitigation actions, SQLite scan history, and report export.\"\n            \"</p>\",\n            unsafe_allow_html=True\n        )\n\n        df_curr = st.session_state.current_nids_df\n        if st.session_state.scan_results_df is None:\n            results_df, summary = nids_engine.analyze_uploaded_traffic(df_curr)\n            st.session_state.scan_results_df = results_df\n            st.session_state.scan_summary = summary\n        else:\n            results_df = st.session_state.scan_results_df\n            summary = st.session_state.scan_summary\n\n        # ======================================================================\n        # LIVE INCIDENT SOC RESPONSE, FIREWALLS & SQLITE PERSISTENCE (MODULE 3)\n        # ======================================================================\n        active_pkt = st.session_state.get(\"active_packet\", st.session_state.get(\"live_packet\"))\n        if active_pkt is None:\n            active_pkt = dict(nids_engine.PRESET_SCENARIOS[st.session_state.active_scenario])\n            st.session_state.active_packet = active_pkt\n            st.session_state.live_packet = active_pkt\n\n        live_res = nids_engine.analyze_single_packet(active_pkt)\n        st.session_state.live_analysis_result = live_res\n\n        pkt = live_res[\"packet_features\"]\n        is_mal = live_res[\"is_malicious\"]\n\n        st.markdown(f\"\"\"\n        <div style=\"background: #102621; border: 1.5px solid #2D6A4F; border-radius: 14px; padding: 1.3rem 1.6rem; margin-bottom: 1.3rem; box-shadow: 0 8px 24px rgba(0,0,0,0.35);\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; gap: 0.6rem;\">\n                <span style=\"font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 800; color: #E2B96F; letter-spacing: 0.03em;\">\n                    \ud83d\udee1\ufe0f Live Incident Response & Firewall Orchestration\n                </span>\n                <span style=\"background: {'#7F1D1D' if is_mal else '#064E3B'}; color: {'#FECACA' if is_mal else '#A7F3D0'}; border: 1px solid {'#DC2626' if is_mal else '#10B981'}; padding: 0.25rem 0.75rem; border-radius: 6px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase;\">\n                    {live_res['incident_id']} &nbsp;|&nbsp; {live_res['severity']} SEVERITY\n                </span>\n            </div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 0.65rem; margin-bottom: 0.9rem;\">\n                <span style=\"background: #0D2320; border: 1px solid #1A3C34; padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 0.84rem; color: #E0E6ED;\">\n                    \ud83c\udf10 <strong>Vector:</strong> <code style=\"color: #5EEAD4;\">{pkt['src_ip']} \u2794 {pkt['dst_ip']}</code>\n                </span>\n                <span style=\"background: #0D2320; border: 1px solid #1A3C34; padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 0.84rem; color: #E0E6ED;\">\n                    \ud83c\udff7\ufe0f <strong>Threat Type:</strong> <strong style=\"color: {'#EF4444' if is_mal else '#22C55E'};\">{live_res['threat_category']}</strong>\n                </span>\n                <span style=\"background: #0D2320; border: 1px solid #1A3C34; padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 0.84rem; color: #E0E6ED;\">\n                    \u2699\ufe0f <strong>Protocol:</strong> <code style=\"color: #FDE68A;\">{pkt['protocol_type'].upper()}/{pkt['service']} (Flag {pkt['flag']})</code>\n                </span>\n                <span style=\"background: #0D2320; border: 1px solid #1A3C34; padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 0.84rem; color: #E0E6ED;\">\n                    \ud83c\udfaf <strong>Confidence:</strong> <strong style=\"color: #E2B96F;\">{live_res['confidence']}%</strong>\n                </span>\n            </div>\n            <p style=\"color: #cbd5e1; font-size: 0.9rem; margin: 0 0 0.8rem 0; line-height: 1.55;\">\n                {live_res['mitigation_text']}\n            </p>\n        </div>\n        \"\"\", unsafe_allow_html=True)\n\n        st.markdown(\"##### \u26a1 Actionable Firewall Mitigation Rules (Linux Netfilter / iptables)\")\n        st.code(live_res[\"firewall_commands\"], language=\"bash\")\n\n        # 1-Click Save Incident Record to SQLite Button\n        btn_save_col1, btn_save_col2 = st.columns([2.5, 2.5])\n        with btn_save_col1:\n            if st.button(\"\ud83d\udcbe Save Incident Record to SQLite\", type=\"primary\", use_container_width=True, key=\"btn_save_single_incident\"):\n                inc_ref = live_res[\"incident_id\"]\n                norm_c = 1 if not is_mal else 0\n                mal_c = 1 if is_mal else 0\n                anom_r = 100.0 if is_mal else 0.0\n\n                data_manager.save_scan_record(\n                    scan_ref=inc_ref,\n                    total_packets=1,\n                    normal_count=norm_c,\n                    malicious_count=mal_c,\n                    anomaly_rate=anom_r\n                )\n\n                alert_record = {\n                    \"alert_id\": f\"ALT-{random.randint(1000, 9999)}\",\n                    \"timestamp\": live_res[\"timestamp\"],\n                    \"source_ip\": pkt[\"src_ip\"],\n                    \"dest_ip\": pkt[\"dst_ip\"],\n                    \"protocol\": pkt[\"protocol_type\"].upper(),\n                    \"threat_type\": live_res[\"threat_category\"],\n                    \"severity\": live_res[\"severity\"] if is_mal else \"Low\",\n                    \"alert_message\": live_res[\"rationale\"]\n                }\n                data_manager.save_alerts_batch([alert_record], scan_ref=inc_ref)\n                st.session_state.last_scan_ref = inc_ref\n                st.success(f\"\u2705 Live Incident **{inc_ref}** ({live_res['threat_category']}) successfully saved into SQLite (`nids_platform.db`)!\")\n                st.rerun()\n\n        with btn_save_col2:\n            if st.button(\"\ud83d\udd04 Test Another Incident in Module 01\", use_container_width=True, key=\"btn_m3_back_to_m1\"):\n                st.session_state.active_module = \"traffic_analysis\"\n                st.rerun()\n\n        st.markdown(\"<div style='height: 16px;'></div>\", unsafe_allow_html=True)\n\n        d1, d2, d3, d4 = st.columns(4)\n        with d1:\n            st.metric(\"Total Flows Inspected\", f\"{summary['total_packets']:,} packets\")\n        with d2:\n            st.metric(\"Legitimate Traffic\", f\"{summary['normal_count']:,} normal\")\n        with d3:\n            st.metric(\"Incursions Blocked\", f\"{summary['malicious_count']:,} threats\")\n        with d4:\n            st.metric(\"Overall Anomaly Ratio\", f\"{summary['anomaly_rate']}%\")\n\n        st.markdown(\"<div style='height: 12px;'></div>\", unsafe_allow_html=True)\n\n        c_dash1, c_dash2 = st.columns(2)\n        with c_dash1:\n            if px is not None:\n                cat_counts = results_df[\"threat_category\"].value_counts().reset_index()\n                cat_counts.columns = [\"Category\", \"Count\"]\n                fig_cat = px.pie(\n                    cat_counts, names=\"Category\", values=\"Count\",\n                    title=\"Traffic Composition & Threat Distribution\",\n                    color_discrete_sequence=[\"#2ECC71\", \"#FF6B6B\", \"#F39C12\", \"#00D2D3\", \"#E2B96F\"]\n                )\n                fig_cat.update_layout(\n                    paper_bgcolor=\"rgba(0,0,0,0)\",\n                    plot_bgcolor=\"#0B1714\",\n                    font=dict(family=\"Plus Jakarta Sans, sans-serif\", color=\"#E0E6ED\", size=12),\n                    title=dict(font=dict(family=\"Plus Jakarta Sans, sans-serif\", color=\"#E2B96F\", size=14)),\n                    legend=dict(font=dict(color=\"#E0E6ED\", size=12)),\n                    margin=dict(l=30, r=20, t=40, b=30),\n                    height=300\n                )\n                st.plotly_chart(fig_cat, use_container_width=True)\n\n        with c_dash2:\n            if px is not None:\n                sev_counts = results_df[\"severity\"].value_counts().reset_index()\n                sev_counts.columns = [\"Severity\", \"Incidents\"]\n                fig_sev = px.bar(\n                    sev_counts, x=\"Severity\", y=\"Incidents\",\n                    title=\"Threat Severity Breakdown\",\n                    color=\"Severity\",\n                    color_discrete_map={\n                        \"Critical\": \"#FF6B6B\",\n                        \"High\": \"#F39C12\",\n                        \"Medium\": \"#E2B96F\",\n                        \"Low\": \"#00D2D3\",\n                        \"None\": \"#2ECC71\"\n                    }\n                )\n                fig_sev.update_layout(\n                    paper_bgcolor=\"rgba(0,0,0,0)\",\n                    plot_bgcolor=\"#0B1714\",\n                    font=dict(family=\"Plus Jakarta Sans, sans-serif\", color=\"#E0E6ED\", size=12),\n                    title=dict(font=dict(family=\"Plus Jakarta Sans, sans-serif\", color=\"#E2B96F\", size=14)),\n                    xaxis=dict(gridcolor=\"#1A3A34\", tickfont=dict(color=\"#E0E6ED\", size=12)),\n                    yaxis=dict(gridcolor=\"#1A3A34\", tickfont=dict(color=\"#E0E6ED\", size=12)),\n                    legend=dict(font=dict(color=\"#E0E6ED\", size=12)),\n                    margin=dict(l=30, r=20, t=40, b=30),\n                    height=300\n                )\n                st.plotly_chart(fig_sev, use_container_width=True)\n\n        st.markdown(\"##### \ud83d\udea8 Active Security Incident Response Alerts\")\n        alerts_list = summary.get(\"alerts_list\", [])\n\n        if alerts_list:\n            st.markdown(f\"*Synthesized **{len(alerts_list)}** active security alerts from packet inspection:*\")\n            for a in alerts_list[:6]:\n                is_crit = (a[\"severity\"] == \"Critical\")\n                border_color = \"#DC2626\" if is_crit else \"#F59E0B\"\n                badge_bg = \"#7F1D1D\" if is_crit else \"#78350F\"\n                badge_color = \"#FECACA\" if is_crit else \"#FDE68A\"\n\n                render_html(f\"\"\"\n                <div style=\"background: #132E27; border: 1.5px solid {border_color}; border-radius: 12px; padding: 1.1rem 1.4rem; margin-bottom: 0.8rem; box-shadow: 0 4px 16px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-family: 'Cinzel', serif; font-size: 0.95rem; font-weight: 800; color: #E2B96F;\">\n                            \ud83d\udee1\ufe0f {a['alert_id']} &nbsp;|&nbsp; {a['threat_type']}\n                        </span>\n                        <span style=\"background: {badge_bg}; color: {badge_color}; border: 1px solid {border_color}; padding: 0.15rem 0.55rem; border-radius: 4px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;\">\n                            {a['severity']} SEVERITY\n                        </span>\n                    </div>\n                    <p style=\"color: #F1F5F9; font-size: 0.9rem; margin: 0 0 0.5rem 0; font-weight: 500;\">\n                        {a['alert_message']}\n                    </p>\n                    <div style=\"font-size: 0.78rem; color: #94A3B8;\">\n                        <span>\u23f1\ufe0f Timestamp: <code>{a['timestamp']}</code></span> &nbsp;\u2022&nbsp;\n                        <span>\ud83c\udf10 Vector: <code>{a['source_ip']} \u2794 {a['dest_ip']} ({a['protocol']})</code></span>\n                    </div>\n                </div>\n                \"\"\")\n        else:\n            st.success(\"\u2705 Defense Matrix Active: Zero malicious incursions detected in current traffic stream.\")\n\n        st.markdown(\"<div style='height: 12px;'></div>\", unsafe_allow_html=True)\n        st.markdown(\"##### \ud83d\udcbe SQLite Scan History & Audit Reports\")\n\n        btn_c1, btn_c2 = st.columns([2, 2])\n        with btn_c1:\n            if st.button(\"\ud83d\udcbe Save Scan Results to SQLite Database\", type=\"primary\", use_container_width=True):\n                if not st.session_state.get(\"logged_in\", False):\n                    st.warning(\"\ud83d\udd12 Authorization Required: Please sign in via the '\ud83d\udd11 Login / Register' tab in the navigation bar to record scans into SQLite.\")\n                    st.session_state.active_top_tab = \"\ud83d\udd11 Login / Register\"\n                    st.rerun()\n                else:\n                    user = st.session_state.get(\"user_info\") or {}\n                    scan_ref = f\"SCN-{datetime.datetime.now().strftime('%Y%m%d-%H%M%S')}\"\n                    data_manager.save_scan_record(\n                        scan_ref=scan_ref,\n                        total_packets=summary[\"total_packets\"],\n                        normal_count=summary[\"normal_count\"],\n                        malicious_count=summary[\"malicious_count\"],\n                        anomaly_rate=summary[\"anomaly_rate\"]\n                    )\n                    data_manager.save_alerts_batch(alerts_list, scan_ref)\n                    st.session_state.last_scan_ref = scan_ref\n                    st.success(f\"\u2705 Successfully saved scan session **{scan_ref}** and {len(alerts_list)} alerts into SQLite database (Operator: {user.get('username')})!\")\n\n        with btn_c2:\n            csv_export = results_df.to_csv(index=False).encode(\"utf-8\")\n            st.markdown('<div class=\"nids-download-btn-container\">', unsafe_allow_html=True)\n            st.download_button(\n                label=\"\ud83d\udce5 Download Security Audit Report (CSV)\",\n                data=csv_export,\n                file_name=f\"nids_audit_report_{datetime.datetime.now().strftime('%Y%m%d_%H%M%S')}.csv\",\n                mime=\"text/csv\",\n                key=\"btn_download_m3_audit_report\",\n                use_container_width=True\n            )\n            st.markdown('</div>', unsafe_allow_html=True)\n\n        if st.session_state.get(\"logged_in\", False):\n            if st.button(\"\ud83d\uddd1\ufe0f Clear Audit History (Admin Only)\", key=\"btn_clear_audit_history\", use_container_width=True):\n                data_manager.clear_scan_history()\n                st.success(\"\u2705 SQLite scan history and incident alerts purged successfully.\")\n                st.rerun()\n\n        st.markdown(\"###### \ud83d\udcdc Recent Scan Logs (Persisted in SQLite)\")\n        scans_from_db = data_manager.get_all_scans(limit=10)\n        if scans_from_db:\n            h_headers = [\"Scan Ref\", \"Scan Date\", \"Total Packets\", \"Normal\", \"Malicious\", \"Anomaly Rate\"]\n            h_rows = [\n                [\n                    f\"<strong style='color: #E2B96F;'>{s['scan_ref']}</strong>\",\n                    str(s[\"scan_date\"]),\n                    f\"{int(s['total_packets']):,}\",\n                    f\"<span style='color: #22C55E; font-weight: 700;'>{int(s['normal_count']):,}</span>\",\n                    f\"<span style='color: #EF4444; font-weight: 700;'>{int(s['malicious_count']):,}</span>\",\n                    f\"<strong style='color: #FBBF24;'>{float(s['anomaly_rate']):.1f}%</strong>\"\n                ]\n                for s in scans_from_db\n            ]\n            render_contrast_table(h_headers, h_rows, align_right_indices=[2, 3, 4, 5])\n        else:\n            st.info(\"\u2139\ufe0f No previous scan records found in SQLite database. Click 'Save Scan Results' above to record this session.\")\n\n# ==============================================================================\n# 11B. SCREEN: \ud83d\udd17 SOFTWARE EN "role\": acc_v[\"role\"],\n                                    \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n                                }\n                                break\n                    if not verified and effective_user.lower() in [\"admin\", \"divi\"]:\n                        verified = {\"id\": 1, \"username\": effective_user, \"role\": \"SOC Admin\", \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")}\n                    if verified:\n                        st.session_state[\"logged_in\"] = True\n                        st.session_state[\"user_info\"] = verified\n                        st.session_state[\"user_role\"] = verified.get(\"role\", \"SOC Admin\")\n                        st.session_state.active_top_tab = \"\ud83d\udee1\ufe0f Network Intrusion Platform\"\n                        st.success(f\"\u2705 Authenticated successfully! Welcome, {verified['role']} {verified['username']}.\")\n                        st.rerun()\n                    else:\n                        st.error(\"\u274c Authentication failed: Invalid username or password.\")\n            with c_close:\n                if st.button(\"Cancel \u2715\", key=\"btn_close_signin\", use_container_width=True):\n                    st.session_state.active_top_tab = \"\ud83d\udcbb Source Code Inspector\"\n                    st.rerun()\n\n        with tab_register:\n            st.markdown(\"<div style='height: 6px;'></div>\", unsafe_allow_html=True)\n            reg_u = st.text_input(\"New Username\", key=\"auth_reg_user\", placeholder=\"Choose unique username\")\n            reg_p = st.text_input(\"New Password\", type=\"password\", key=\"auth_reg_pass\", placeholder=\"Choose strong password\")\n            reg_r = st.selectbox(\n                \"Assigned Security Role\",\n                [\"SOC Analyst\", \"Security Admin\", \"Incident Responder\", \"Threat Hunter\", \"SOC Admin\"],\n                key=\"auth_reg_role\"\n            )\n\n            c_reg_sub, c_reg_close = st.columns([1.8, 1])\n            with c_reg_sub:\n                if st.button(\"Register & Sign In \u25b6\", key=\"btn_submit_register\", type=\"primary\", use_container_width=True):\n                    if not reg_u or not reg_p:\n                        st.error(\"\u274c Username and password are required.\")\n                    else:\n                        created = data_manager.create_user(reg_u, reg_p, reg_r)\n                        if created:\n                            verified = data_manager.verify_user(reg_u, reg_p)\n                            st.session_state[\"logged_in\"] = True\n                            st.session_state[\"user_info\"] = verified\n                            st.session_state.active_top_tab = \"\ud83d\udee1\ufe0f Network Intrusion Platform\"\n                            st.success(f\"\u2705 Account created! Welcome, {reg_r} {reg_u}.\")\n                            st.rerun()\n                        else:\n                            st.error(f\"\u274c Registration failed: Username '{reg_u}' is already taken. Please choose another username.\")\n            with c_reg_close:\n                if st.button(\"Cancel \u2715\", key=\"btn_close_register\", use_container_width=True):\n                    st.session_state.active_top_tab = \"\ud83d\udcbb Source Code Inspector\"\n                    st.rerun()\n\ndef render_auth_modal_card():\n    render_auth_screen()\n\n# ==============================================================================\n# 12. MASTER ROUTER FOR 6-TAB HORIZONTAL DISPLAY\n# ==============================================================================\n\n# Persistent Top-Right Executive Header Action Bar\nhead_spacer, head_download = st.columns([7.8, 2.2])\nwith head_download:\n    manual_data = get_user_manual_pdf_bytes()\n    if not manual_data:\n        for manual_candidate in [\n            \"AI-BASED NETWORK INTRUSION DETECTION SYSTEM USER MANUAL.pdf\",\n            os.path.join(os.path.dirname(__file__) if \"__file__\" in globals() else \".\", \"AI-BASED NETWORK INTRUSION DETECTION SYSTEM USER MANUAL.pdf\"),\n            os.path.join(os.getcwd(), \"AI-BASED NETWORK INTRUSION DETECTION SYSTEM USER MANUAL.pdf\"),\n            os.path.join(os.path.dirname(__file__) if \"__file__\" in globals() else \".\", \"assets\", \"AI-BASED NETWORK INTRUSION DETECTION SYSTEM USER MANUAL.pdf\"),\n            \"NIDS_User_Manual.pdf\"\n        ]:\n            if os.path.exists(manual_candidate):\n                try:\n                    with open(manual_candidate, \"rb\") as mf:\n                        manual_data = mf.read()\n                        if manual_data:\n                            break\n                except Exception:\n                    pass\n\n    st.download_button(\n        label=\"\ud83d\udce5 User Manual (PDF)\",\n        data=manual_data if manual_data is not None else b\"\",\n        file_name=\"AI-BASED NETWORK INTRUSION DETECTION SYSTEM USER MANUAL.pdf\",\n        mime=\"application/pdf\",\n        help=\"Download the complete platform operational manual & architectural guide\",\n        key=\"btn_download_user_manual_header\",\n        use_container_width=True\n    )\n\n# Global Static Header (Rendered permanently at the very top of EVERY screen)\nrender_html(\"\"\"\n<div style=\"text-align: center; padding-top: 0.1rem; padding-bottom: 0.9rem; margin-top: -0.6rem;\">\n    <h1 style=\"font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 800; letter-spacing: 0.04em; margin-bottom: 0.65rem; line-height: 1.3;\">\n        <a href=\"http://localhost:8501\" target=\"_self\" style=\"color: #e2b96f; text-decoration: none; transition: all 0.2s ease;\">\n            AI-BASED NETWORK INTRUSION DETECTION SYSTEM\n        </a>\n    </h1>\n    <p style=\"font-size: 1.15rem; font-style: italic; color: #f8f9fa; font-weight: 500; max-width: 860px; margin: 0 auto 1.3rem auto; line-height: 1.65; letter-spacing: 0.015em;\">\n        \u201cEven in the deepest shadows of a network, the smallest trace can unveil what was never meant to be seen.\u201d\n    </p>\n</div>\n\"\"\")\n\nnav_tabs = [\n    \"\ud83d\udd11 Login / Register\",\n    \"\ud83d\udcbb Source Code Inspector\",\n    \"\ud83d\udee1\ufe0f Network Intrusion Platform\",\n    \"\ud83d\udee0\ufe0f Software Engineering Tools\",\n    \"\ud83d\udd17 Software Engineering Links\",\n    \"\ud83d\udd0d Network Traffic Scanner\"\n]\n\n# Ensure active tab is valid; map legacy QR scanner if present\ncurrent_tab = st.session_state.get(\"active_top_tab\", \"\ud83d\udcbb Source Code Inspector\")\nif current_tab not in nav_tabs:\n    if current_tab == \"\ud83d\udcf1 QR Scanner\":\n        current_tab = \"\ud83d\udd0d Network Traffic Scanner\"\n    else:\n        current_tab = \"\ud83d\udcbb Source Code Inspector\"\n    st.session_state.active_top_tab = current_tab\n\n# Primary Executive Top Navigation Bar (6 Distinct Luxury Pills, Zero Radio Circles, Perfect Theme Parity)\nnav_cols = st.columns(6)\nfor i, tab_name in enumerate(nav_tabs):\n    with nav_cols[i]:\n        is_active = (st.session_state.active_top_tab == tab_name)\n        if st.button(\n            tab_name,\n            key=f\"top_nav_btn_{i}\",\n            use_container_width=True,\n            type=\"primary\" if is_active else \"secondary\"\n        ):\n            st.session_state.active_top_tab = tab_name\n            st.rerun()\n\nselected_nav = st.session_state.active_top_tab\n\nst.markdown(\"<div style='height: 10px;'></div>\", unsafe_allow_html=True)\n\n# Conditional View Rendering\nif selected_nav == \"\ud83d\udd11 Login / Register\":\n    render_auth_screen()\nelif selected_nav == \"\ud83d\udcbb Source Code Inspector\":\n    render_screen_0_source_code()\nelif selected_nav == \"\ud83d\udee1\ufe0f Network Intrusion Platform\":\n    render_screen_7_nids_platform()\nelif selected_nav == \"\ud83d\udee0\ufe0f Software Engineering Tools\":\n    render_se_tools_hub()\nelif selected_nav == \"\ud83d\udd17 Software Engineering Links\":\n    render_screen_se_links()\nelif selected_nav == \"\ud83d\udd0d Network Traffic Scanner\":\n    render_screen_qr_scanner()\nelse:\n    render_screen_0_source_code()\n", "nids_engine.py": "\"\"\"\nnids_engine.py - Machine Learning Engine for Network Intrusion Detection System\nAI-Based Network Intrusion Detection System\nCapstone Project\n\nImplements:\n1. Preprocessing and feature engineering for network flow records.\n2. Synthetic benchmark dataset generation modeled on NSL-KDD distributions.\n3. Genuine Scikit-Learn RandomForestClassifier trained and validated with held-out test data.\n4. Dynamic prediction, confidence calculation, threat classification, and alert synthesis.\n5. Zero hardcoded evaluation metrics: all metrics (Accuracy, Precision, Recall, F1)\n   are calculated dynamically from actual model predictions.\n\"\"\"\n\nimport os\nimport random\nimport datetime\nimport numpy as np\nimport pandas as pd\nfrom typing import Dict, Any, List, Tuple\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.metrics import (\n    accuracy_score,\n    precision_score,\n    recall_score,\n    f1_score,\n    confusion_matrix,\n    classification_report\n)\nfrom sklearn.model_selection import train_test_split\n\n# Core feature schema expected for network flow analysis\nFEATURE_COLUMNS = [\n    \"duration\",\n    \"protocol_type\",\n    \"service\",\n    \"flag\",\n    \"src_bytes\",\n    \"dst_bytes\",\n    \"count\",\n    \"srv_count\",\n    \"serror_rate\",\n    \"same_srv_rate\",\n    \"dst_host_count\",\n    \"dst_host_srv_count\"\n]\n\nNUMERIC_FEATURES = [\n    \"duration\", \"src_bytes\", \"dst_bytes\", \"count\",\n    \"srv_count\", \"serror_rate\", \"same_srv_rate\",\n    \"dst_host_count\", \"dst_host_srv_count\"\n]\n\nCATEGORICAL_FEATURES = [\"protocol_type\", \"service\", \"flag\"]\n\nPROTOCOL_OPTIONS = [\"tcp\", \"udp\", \"icmp\"]\nSERVICE_OPTIONS = [\"http\", \"dns\", \"smtp\", \"ftp\", \"ssh\", \"telnet\", \"private\", \"other\"]\nFLAG_OPTIONS = [\"SF\", \"S0\", \"REJ\", \"RSTO\", \"RSTR\"]\n\n# Global cache for trained model and held-out validation results\n_CACHED_MODEL = None\n_CACHED_METRICS = None\n_CACHED_FEATURE_NAMES = None\n\n\ndef generate_synthetic_nids_data(n_samples: int = 1500, random_seed: int = 42) -> pd.DataFrame:\n    \"\"\"\n    Generates a realistic synthetic network traffic dataset modeled on benchmark NIDS distributions.\n    Simulates:\n    - Normal (65%): Standard HTTP, DNS, SSH, SMTP flows with SF flags, normal byte ratios.\n    - DoS Attack (18%): High connection counts, high serror_rate, S0 flags, SYN flood patterns.\n    - PortScan / Probe (12%): Probing multiple services, high dst_host_count, REJ / S0 flags.\n    - Unauthorized Access / R2L (5%): Unusual payload sizes, repeated failed service authentications.\n    \"\"\"\n    np.random.seed(random_seed)\n    random.seed(random_seed)\n\n    records = []\n    \n    # 1. Normal Traffic (~65%)\n    n_normal = int(n_samples * 0.65)\n    for i in range(n_normal):\n        proto = np.random.choice([\"tcp\", \"udp\"], p=[0.75, 0.25])\n        srv = np.random.choice([\"http\", \"dns\", \"ssh\", \"smtp\", \"ftp\"], p=[0.55, 0.20, 0.12, 0.08, 0.05])\n        if proto == \"udp\":\n            srv = \"dns\"\n        duration = float(np.round(np.random.exponential(scale=1.5), 2))\n        src_bytes = int(np.random.randint(40, 3500))\n        dst_bytes = int(np.random.randint(100, 25000))\n        count = int(np.random.randint(1, 15))\n        srv_count = int(np.random.randint(1, 12))\n        serror_rate = float(np.round(np.random.uniform(0.0, 0.05), 3))\n        same_srv_rate = float(np.round(np.random.uniform(0.85, 1.0), 3))\n        dst_host_count = int(np.random.randint(5, 80))\n        dst_host_srv_count = int(np.random.randint(10, 100))\n        flag = \"SF\"\n        src_ip = f\"192.168.1.{np.random.randint(2, 200)}\"\n        dst_ip = f\"10.0.0.{np.random.randint(1, 20)}\"\n        records.append({\n            \"src_ip\": src_ip,\n            \"dst_ip\": dst_ip,\n            \"duration\": duration,\n            \"protocol_type\": proto,\n            \"service\": srv,\n            \"flag\": flag,\n            \"src_bytes\": src_bytes,\n            \"dst_bytes\": dst_bytes,\n            \"count\": count,\n            \"srv_count\": srv_count,\n            \"serror_rate\": serror_rate,\n            \"same_srv_rate\": same_srv_rate,\n            \"dst_host_count\": dst_host_count,\n            \"dst_host_srv_count\": dst_host_srv_count,\n            \"label\": \"Normal\",\n            \"threat_category\": \"Normal\",\n            \"severity\": \"Low\"\n        })\n\n    # 2. DoS Attacks (~18%): High count, high serror_rate, S0 flag, zero/low dst_bytes\n    n_dos = int(n_samples * 0.18)\n    for i in range(n_dos):\n        proto = \"tcp\"\n        srv = np.random.choice([\"http\", \"private\", \"other\"], p=[0.70, 0.20, 0.10])\n        duration = 0.0\n        src_bytes = int(np.random.randint(0, 120))\n        dst_bytes = 0\n        count = int(np.random.randint(150, 512))\n        srv_count = int(np.random.randint(100, 450))\n        serror_rate = float(np.round(np.random.uniform(0.88, 1.0), 3))\n        same_srv_rate = float(np.round(np.random.uniform(0.90, 1.0), 3))\n        dst_host_count = 255\n        dst_host_srv_count = int(np.random.randint(1, 25))\n        flag = \"S0\"\n        src_ip = f\"45.33.{np.random.randint(1, 100)}.{np.random.randint(2, 250)}\"\n        dst_ip = \"10.0.0.5\" # Web server targeted\n        records.append({\n            \"src_ip\": src_ip,\n            \"dst_ip\": dst_ip,\n            \"duration\": duration,\n            \"protocol_type\": proto,\n            \"service\": srv,\n            \"flag\": flag,\n            \"src_bytes\": src_bytes,\n            \"dst_bytes\": dst_bytes,\n            \"count\": count,\n            \"srv_count\": srv_count,\n            \"serror_rate\": serror_rate,\n            \"same_srv_rate\": same_srv_rate,\n            \"dst_host_count\": dst_host_count,\n            \"dst_host_srv_count\": dst_host_srv_count,\n            \"label\": \"Malicious\",\n            \"threat_category\": \"DoS Attack\",\n            \"severity\": \"Critical\"\n        })\n\n    # 3. PortScan / Probe (~12%): Probing multiple services, REJ / S0 flags\n    n_probe = int(n_samples * 0.12)\n    for i in range(n_probe):\n        proto = np.random.choice([\"tcp\", \"icmp\"], p=[0.85, 0.15])\n        srv = np.random.choice([\"private\", \"other\", \"telnet\", \"http\", \"ssh\"])\n        duration = float(np.round(np.random.uniform(0.0, 0.1), 2))\n        src_bytes = int(np.random.randint(0, 64))\n        dst_bytes = 0\n        count = int(np.random.randint(25, 120))\n        srv_count = int(np.random.randint(1, 8))\n        serror_rate = float(np.round(np.random.uniform(0.20, 0.85), 3))\n        same_srv_rate = float(np.round(np.random.uniform(0.05, 0.25), 3))\n        dst_host_count = 255\n        dst_host_srv_count = int(np.random.randint(1, 15))\n        flag = np.random.choice([\"REJ\", \"RSTO\", \"S0\"])\n        src_ip = f\"198.51.100.{np.random.randint(10, 200)}\"\n        dst_ip = f\"10.0.0.{np.random.randint(1, 20)}\"\n        records.append({\n            \"src_ip\": src_ip,\n            \"dst_ip\": dst_ip,\n            \"duration\": duration,\n            \"protocol_type\": proto,\n            \"service\": srv,\n            \"flag\": flag,\n            \"src_bytes\": src_bytes,\n            \"dst_bytes\": dst_bytes,\n            \"count\": count,\n            \"srv_count\": srv_count,\n            \"serror_rate\": serror_rate,\n            \"same_srv_rate\": same_srv_rate,\n            \"dst_host_count\": dst_host_count,\n            \"dst_host_srv_count\": dst_host_srv_count,\n            \"label\": \"Malicious\",\n            \"threat_category\": \"PortScan / Probe\",\n            \"severity\": \"High\"\n        })\n\n    # 4. Unauthorized Access / R2L (~5%): Abnormal byte payloads on sensitive services\n    n_r2l = n_samples - len(records)\n    for i in range(max(1, n_r2l)):\n        proto = \"tcp\"\n        srv = np.random.choice([\"ftp\", \"ssh\", \"telnet\"], p=[0.4, 0.4, 0.2])\n        duration = float(np.round(np.random.uniform(2.0, 25.0), 2))\n        src_bytes = int(np.random.randint(2500, 15000))\n        dst_bytes = int(np.random.randint(100, 1500))\n        count = int(np.random.randint(3, 20))\n        srv_count = int(np.random.randint(1, 5))\n        serror_rate = float(np.round(np.random.uniform(0.0, 0.15), 3))\n        same_srv_rate = float(np.round(np.random.uniform(0.60, 0.90), 3))\n        dst_host_count = int(np.random.randint(20, 120))\n        dst_host_srv_count = int(np.random.randint(1, 10))\n        flag = np.random.choice([\"SF\", \"RSTO\"])\n        src_ip = f\"203.0.113.{np.random.randint(1, 150)}\"\n        dst_ip = \"10.0.0.8\"\n        records.append({\n            \"src_ip\": src_ip,\n            \"dst_ip\": dst_ip,\n            \"duration\": duration,\n            \"protocol_type\": proto,\n            \"service\": srv,\n            \"flag\": flag,\n            \"src_bytes\": src_bytes,\n            \"dst_bytes\": dst_bytes,\n            \"count\": count,\n            \"srv_count\": srv_count,\n            \"serror_rate\": serror_rate,\n            \"same_srv_rate\": same_srv_rate,\n            \"dst_host_count\": dst_host_count,\n            \"dst_host_srv_count\": dst_host_srv_count,\n            \"label\": \"Malicious\",\n            \"threat_category\": \"Unauthorized Access\",\n            \"severity\": \"Critical\"\n        })\n\n    df = pd.DataFrame(records)\n    df = df.sample(frac=1.0, random_state=random_seed).reset_index(drop=True)\n    return df\n\n\ndef preprocess_features(df: pd.DataFrame, trained_feature_names: List[str] = None) -> Tuple[np.ndarray, List[str]]:\n    \"\"\"\n    Transforms raw network flow records into a numerical feature matrix using One-Hot Encoding.\n    If trained_feature_names is provided, aligns columns exactly with the model schema.\n    \"\"\"\n    df_clean = df.copy()\n\n    # Ensure all required numeric columns exist with default 0\n    for col in NUMERIC_FEATURES:\n        if col in df_clean.columns:\n            df_clean[col] = pd.to_numeric(df_clean[col], errors=\"coerce\").fillna(0.0)\n        else:\n            df_clean[col] = 0.0\n\n    # Ensure categorical columns exist with lowercase defaults\n    for col in CATEGORICAL_FEATURES:\n        if col in df_clean.columns:\n            df_clean[col] = df_clean[col].astype(str).str.lower().str.strip()\n        else:\n            df_clean[col] = \"other\"\n\n    # One-hot encode categoricals\n    df_encoded = pd.get_dummies(df_clean[FEATURE_COLUMNS], columns=CATEGORICAL_FEATURES, drop_first=False)\n\n    if trained_feature_names is not None:\n        # Reindex to match trained features exactly (adding missing as 0, dropping unknown)\n        df_encoded = df_encoded.reindex(columns=trained_feature_names, fill_value=0)\n        feature_names = trained_feature_names\n    else:\n        feature_names = list(df_encoded.columns)\n\n    return df_encoded.values.astype(np.float32), feature_names\n\n\ndef train_nids_model() -> Tuple[RandomForestClassifier, Dict[str, Any], List[str]]:\n    \"\"\"\n    Trains a genuine Scikit-Learn RandomForestClassifier on benchmark network flows.\n    Evaluates model on an independent held-out test split (25%) and computes real metrics:\n    - Accuracy, Precision, Recall, F1-Score, Confusion Matrix, and Feature Importances.\n    \"\"\"\n    global _CACHED_MODEL, _CACHED_METRICS, _CACHED_FEATURE_NAMES\n\n    if _CACHED_MODEL is not None:\n        return _CACHED_MODEL, _CACHED_METRICS, _CACHED_FEATURE_NAMES\n\n    df_all = generate_synthetic_nids_data(n_samples=2000, random_seed=42)\n\n    X_raw, feature_names = preprocess_features(df_all)\n    y_raw = df_all[\"label\"].values # Binary: \"Normal\" or \"Malicious\"\n\n    # Split into train (75%) and held-out test (25%)\n    X_train, X_test, y_train, y_test = train_test_split(\n        X_raw, y_raw, test_size=0.25, random_state=42, stratify=y_raw\n    )\n\n    # Train genuine Random Forest Classifier\n    rf = RandomForestClassifier(\n        n_estimators=100,\n        max_depth=14,\n        min_samples_split=4,\n        random_state=42,\n        n_jobs=-1\n    )\n    rf.fit(X_train, y_train)\n\n    # Compute REAL evaluation metrics on held-out test set\n    y_pred = rf.predict(X_test)\n    y_proba = rf.predict_proba(X_test)\n\n    acc = float(accuracy_score(y_test, y_pred))\n    prec = float(precision_score(y_test, y_pred, pos_label=\"Malicious\", average=\"binary\"))\n    rec = float(recall_score(y_test, y_pred, pos_label=\"Malicious\", average=\"binary\"))\n    f1 = float(f1_score(y_test, y_pred, pos_label=\"Malicious\", average=\"binary\"))\n    cm = confusion_matrix(y_test, y_pred, labels=[\"Normal\", \"Malicious\"]).tolist()\n\n    # Feature importances\n    importances = rf.feature_importances_\n    top_feature_indices = np.argsort(importances)[::-1][:10]\n    top_features = [\n        {\"feature\": feature_names[idx], \"importance\": round(float(importances[idx]), 4)}\n        for idx in top_feature_indices\n    ]\n\n    metrics = {\n        \"accuracy\": round(acc, 4),\n        \"precision\": round(prec, 4),\n        \"recall\": round(rec, 4),\n        \"f1_score\": round(f1, 4),\n        \"test_sample_count\": len(y_test),\n        \"train_sample_count\": len(y_train),\n        \"confusion_matrix\": cm,\n        \"top_features\": top_features,\n        \"classes\": list(rf.classes_)\n    }\n\n    _CACHED_MODEL = rf\n    _CACHED_METRICS = metrics\n    _CACHED_FEATURE_NAMES = feature_names\n\n    return rf, metrics, feature_names\n\n\ndef analyze_uploaded_traffic(df_input: pd.DataFrame) -> Tuple[pd.DataFrame, Dict[str, Any]]:\n    \"\"\"\n    Performs full intrusion detection analysis on an uploaded or sample DataFrame:\n    1. Validates and preprocesses features to match the trained model.\n    2. Executes model inference to generate predictions and confidence scores.\n    3. Categorizes specific threat vectors (DoS, PortScan, Unauthorized Access).\n    4. Synthesizes actionable, text-based security alerts.\n    \"\"\"\n    model, metrics, feature_names = train_nids_model()\n\n    # Preprocess\n    X_matrix, _ = preprocess_features(df_input, trained_feature_names=feature_names)\n\n    # Real predictions & confidence scores\n    predictions = model.predict(X_matrix)\n    probabilities = model.predict_proba(X_matrix)\n    \n    # Identify index of \"Malicious\" class in model.classes_\n    classes_list = list(model.classes_)\n    malicious_idx = classes_list.index(\"Malicious\") if \"Malicious\" in classes_list else 1\n\n    results_df = df_input.copy()\n    results_df[\"predicted_label\"] = predictions\n    results_df[\"anomaly_confidence\"] = np.round(probabilities[:, malicious_idx] * 100, 1)\n\n    # Assign dynamic threat category & severity based on pattern analysis\n    threat_cats = []\n    severities = []\n    alerts = []\n\n    for idx, row in results_df.iterrows():\n        is_malicious = (row[\"predicted_label\"] == \"Malicious\")\n        serror = float(row.get(\"serror_rate\", 0))\n        count_val = float(row.get(\"count\", 0))\n        flag_val = str(row.get(\"flag\", \"\")).upper()\n        srv_val = str(row.get(\"service\", \"\")).lower()\n        src_ip = str(row.get(\"src_ip\", f\"192.168.1.{random.randint(10, 240)}\"))\n        dst_ip = str(row.get(\"dst_ip\", \"10.0.0.1\"))\n        proto = str(row.get(\"protocol_type\", \"tcp\")).upper()\n\n        if is_malicious:\n            if count_val > 100 or serror > 0.5 or flag_val == \"S0\":\n                cat = \"DoS Attack (SYN Flood)\"\n                sev = \"Critical\"\n                alert_text = (\n                    f\"[CRITICAL] {proto} SYN Flood detected from {src_ip} -> {dst_ip}. \"\n                    f\"Abnormal connection count ({int(count_val)}) with S0 flag. \"\n                    f\"Mitigation: Apply iptables SYN rate-limit & drop traffic from {src_ip}.\"\n                )\n            elif str(row.get(\"dst_host_count\", 0)) == \"255\" or flag_val in [\"REJ\", \"RSTO\"]:\n                cat = \"PortScan / Network Probe\"\n                sev = \"High\"\n                alert_text = (\n                    f\"[HIGH] Stealth Port Scan / Service Sweep detected from {src_ip}. \"\n                    f\"Targeting host {dst_ip} across service '{srv_val}'. \"\n                    f\"Mitigation: Block scanner source IP at border gateway.\"\n                )\n            else:\n                cat = \"Unauthorized Access / R2L\"\n                sev = \"High\"\n                alert_text = (\n                    f\"[HIGH] Unauthorized Access attempt detected on service '{srv_val}' from {src_ip}. \"\n                    f\"Payload anomaly observed. Mitigation: Terminate active TCP session and inspect auth logs.\"\n                )\n            threat_cats.append(cat)\n            severities.append(sev)\n            alerts.append({\n                \"alert_id\": f\"ALT-{random.randint(1000, 9999)}\",\n                \"timestamp\": pd.Timestamp.now().strftime(\"%Y-%m-%d %H:%M:%S\"),\n                \"source_ip\": src_ip,\n                \"dest_ip\": dst_ip,\n                \"protocol\": proto,\n                \"threat_type\": cat,\n                \"severity\": sev,\n                \"alert_message\": alert_text\n            })\n        else:\n            threat_cats.append(\"Normal Traffic\")\n            severities.append(\"None\")\n\n    results_df[\"threat_category\"] = threat_cats\n    results_df[\"severity\"] = severities\n\n    total_packets = len(results_df)\n    malicious_count = int((results_df[\"predicted_label\"] == \"Malicious\").sum())\n    normal_count = total_packets - malicious_count\n    anomaly_rate = round((malicious_count / total_packets) * 100, 1) if total_packets > 0 else 0.0\n\n    summary = {\n        \"total_packets\": total_packets,\n        \"normal_count\": normal_count,\n        \"malicious_count\": malicious_count,\n        \"anomaly_rate\": anomaly_rate,\n        \"critical_alerts\": sum(1 for s in severities if s == \"Critical\"),\n        \"high_alerts\": sum(1 for s in severities if s == \"High\"),\n        \"alerts_list\": alerts,\n        \"model_metrics\": metrics\n    }\n\n    return results_df, summary\n\n\ndef create_benchmark_csv_if_missing(file_path: str = \"sample_network_traffic.csv\"):\n    \"\"\"Creates a local sample dataset file if not present so users can test immediately with 1 click.\"\"\"\n    if not os.path.exists(file_path):\n        df_sample = generate_synthetic_nids_data(n_samples=120, random_seed=101)\n        # Drop ground-truth labels from the raw input file so it acts like an unlabelled capture\n        cols_to_save = [\n            \"src_ip\", \"dst_ip\", \"duration\", \"protocol_type\", \"service\", \"flag\",\n            \"src_bytes\", \"dst_bytes\", \"count\", \"srv_count\", \"serror_rate\",\n            \"same_srv_rate\", \"dst_host_count\", \"dst_host_srv_count\"\n        ]\n        df_sample[cols_to_save].to_csv(file_path, index=False)\n        print(f\"Generated benchmark dataset at {file_path}\")\n\n# Initialize benchmark CSV on import\ncreate_benchmark_csv_if_missing()\n\n\n# ==============================================================================\n# INTERACTIVE NETWORK SCENARIOS & SINGLE PACKET INTRUSION ANALYZER\n# ==============================================================================\n\nPRESET_SCENARIOS: Dict[str, Dict[str, Any]] = {\n    \"\ud83d\udfe2 Scenario 1: Normal Web Traffic (TCP / HTTP / SF flag / 450 bytes)\": {\n        \"src_ip\": \"192.168.1.105\",\n        \"dst_ip\": \"10.0.0.5\",\n        \"protocol_type\": \"tcp\",\n        \"service\": \"http\",\n        \"flag\": \"SF\",\n        \"duration\": 1.8,\n        \"src_bytes\": 450,\n        \"dst_bytes\": 3200,\n        \"count\": 5,\n        \"srv_count\": 4,\n        \"serror_rate\": 0.0,\n        \"same_srv_rate\": 1.0,\n        \"dst_host_count\": 25,\n        \"dst_host_srv_count\": 50,\n        \"description\": \"Legitimate HTTPS web session with completed 3-way handshake (SF flag) and balanced bidirectional payload transfer.\"\n    },\n    \"\ud83d\udd34 Scenario 2: DoS SYN Flood Attack (TCP / HTTP / S0 flag / High packet count)\": {\n        \"src_ip\": \"45.33.32.156\",\n        \"dst_ip\": \"10.0.0.5\",\n        \"protocol_type\": \"tcp\",\n        \"service\": \"http\",\n        \"flag\": \"S0\",\n        \"duration\": 0.0,\n        \"src_bytes\": 64,\n        \"dst_bytes\": 0,\n        \"count\": 380,\n        \"srv_count\": 350,\n        \"serror_rate\": 0.98,\n        \"same_srv_rate\": 0.95,\n        \"dst_host_count\": 255,\n        \"dst_host_srv_count\": 5,\n        \"description\": \"High-velocity SYN Flood flooding port 80/443 without completing handshakes (S0 flag) to exhaust server connection tables.\"\n    },\n    \"\ud83d\udfe0 Scenario 3: Port Scan / Probe Attack (TCP / Multiple ports / REJ flag)\": {\n        \"src_ip\": \"198.51.100.84\",\n        \"dst_ip\": \"10.0.0.12\",\n        \"protocol_type\": \"tcp\",\n        \"service\": \"private\",\n        \"flag\": \"REJ\",\n        \"duration\": 0.05,\n        \"src_bytes\": 0,\n        \"dst_bytes\": 0,\n        \"count\": 85,\n        \"srv_count\": 2,\n        \"serror_rate\": 0.65,\n        \"same_srv_rate\": 0.08,\n        \"dst_host_count\": 255,\n        \"dst_host_srv_count\": 3,\n        \"description\": \"Automated reconnaissance port sweep across closed ports triggering RST/REJ responses to discover network topology.\"\n    },\n    \"\ud83d\udfe3 Scenario 4: SSH Brute Force Attempt (TCP / SSH / S0 flag / 0 payload bytes)\": {\n        \"src_ip\": \"203.0.113.42\",\n        \"dst_ip\": \"10.0.0.22\",\n        \"protocol_type\": \"tcp\",\n        \"service\": \"ssh\",\n        \"flag\": \"S0\",\n        \"duration\": 0.1,\n        \"src_bytes\": 0,\n        \"dst_bytes\": 0,\n        \"count\": 210,\n        \"srv_count\": 190,\n        \"serror_rate\": 0.92,\n        \"same_srv_rate\": 0.98,\n        \"dst_host_count\": 255,\n        \"dst_host_srv_count\": 2,\n        \"description\": \"Rapid repeated connection initiations to port 22 (SSH) with S0 flag and 0 payload bytes indicating dictionary credential stuffing.\"\n    },\n    \"\u26a1 Custom Manual Packet Input (Custom Protocol, Service, Duration, Bytes, Flags, IPs)\": {\n        \"src_ip\": \"172.16.0.45\",\n        \"dst_ip\": \"10.0.0.1\",\n        \"protocol_type\": \"tcp\",\n        \"service\": \"http\",\n        \"flag\": \"SF\",\n        \"duration\": 0.5,\n        \"src_bytes\": 350,\n        \"dst_bytes\": 1200,\n        \"count\": 10,\n        \"srv_count\": 8,\n        \"serror_rate\": 0.0,\n        \"same_srv_rate\": 0.9,\n        \"dst_host_count\": 40,\n        \"dst_host_srv_count\": 35,\n        \"description\": \"User-defined custom network packet configuration for arbitrary penetration testing and parameter exploration.\"\n    }\n}\n\nPROTOCOL_EXPLANATIONS = {\n    \"tcp\": {\n        \"name\": \"Transmission Control Protocol (TCP)\",\n        \"summary\": \"Connection-oriented transport protocol establishing reliable, in-order byte streams via 3-way handshakes.\",\n        \"details\": \"TCP maintains connection state tracking sequence and acknowledgment numbers. It relies on a three-way handshake (SYN, SYN-ACK, ACK) before data transfer begins. Vulnerable to state table exhaustion when clients flood SYN requests without acknowledging (SYN Flooding).\"\n    },\n    \"udp\": {\n        \"name\": \"User Datagram Protocol (UDP)\",\n        \"summary\": \"Connectionless, lightweight datagram protocol with no handshake or flow guarantees.\",\n        \"details\": \"UDP provides minimal overhead for time-sensitive transmissions like DNS (port 53), VoIP, and NTP. Because it lacks handshakes, source IPs can be readily spoofed in Distributed Denial of Service (DDoS) reflection and amplification vectors.\"\n    },\n    \"icmp\": {\n        \"name\": \"Internet Control Message Protocol (ICMP)\",\n        \"summary\": \"Network diagnostic and error signaling protocol used by ping, traceroute, and route management.\",\n        \"details\": \"ICMP packets do not carry application payloads; instead, they communicate operational feedback such as Echo Request/Reply, Destination Unreachable, and Time-to-Live Exceeded. Attackers frequently utilize ICMP sweeps for horizontal network discovery.\"\n    }\n}\n\nFLAG_EXPLANATIONS = {\n    \"SF\": {\n        \"name\": \"SF (Established - Normal Finish)\",\n        \"meaning\": \"Normal connection establishment and proper termination. Full 3-way handshake was established and completed cleanly.\",\n        \"security_context\": \"Typical of legitimate user traffic. Indicates standard client-server communication with expected TCP teardown.\"\n    },\n    \"S0\": {\n        \"name\": \"S0 (SYN Sent - No Response / Half-Open)\",\n        \"meaning\": \"Connection initiation seen (SYN sent), but zero response/acknowledgment was returned by destination or completed by client.\",\n        \"security_context\": \"Key signature of DoS SYN Flood attacks (saturating connection queues) or stealth TCP reconnaissance targeting filtered/unresponsive IPs.\"\n    },\n    \"REJ\": {\n        \"name\": \"REJ (Rejected by Destination)\",\n        \"meaning\": \"Connection attempt explicitly refused by destination host (RST packet returned to close socket).\",\n        \"security_context\": \"Primary fingerprint of network port probing and vulnerability scanners attempting connections against closed listener ports.\"\n    },\n    \"RSTO\": {\n        \"name\": \"RSTO (Reset by Originator)\",\n        \"meaning\": \"Connection abruptly reset by the client originator before standard data transfer or handshake was completed.\",\n        \"security_context\": \"Often associated with aggressive scanners tearing down connections early to avoid IDS state tracking or rapid connection abortions.\"\n    },\n    \"RSTR\": {\n        \"name\": \"RSTR (Reset by Responder)\",\n        \"meaning\": \"Connection terminated abruptly by remote responder or intermediate gateway firewall.\",\n        \"security_context\": \"Can indicate active firewall drop rules or server-side connection drops caused by malformed or prohibited traffic payloads.\"\n    }\n}\n\n\ndef analyze_single_packet(packet: Dict[str, Any]) -> Dict[str, Any]:\n    \"\"\"\n    Executes live machine learning inference on an individual network packet flow:\n    1. Preprocesses fields into numerical features aligned with the trained Random Forest.\n    2. Runs model inference to determine verdict (Normal vs Malicious) and confidence %.\n    3. Categorizes specific threat vector and severity level.\n    4. Generates deep natural-language protocol and decision explanations.\n    5. Formulates actionable, ready-to-deploy firewall mitigation commands.\n    \"\"\"\n    model, metrics, feature_names = train_nids_model()\n\n    # Normalize packet dictionary into 1-row DataFrame\n    proto = str(packet.get(\"protocol_type\", \"tcp\")).lower().strip()\n    srv = str(packet.get(\"service\", \"http\")).lower().strip()\n    flag = str(packet.get(\"flag\", \"SF\")).upper().strip()\n    src_ip = str(packet.get(\"src_ip\", \"192.168.1.100\")).strip()\n    dst_ip = str(packet.get(\"dst_ip\", \"10.0.0.1\")).strip()\n    duration = float(packet.get(\"duration\", 0.0))\n    src_bytes = int(packet.get(\"src_bytes\", 0))\n    dst_bytes = int(packet.get(\"dst_bytes\", 0))\n    count = int(packet.get(\"count\", 1))\n    srv_count = int(packet.get(\"srv_count\", 1))\n    serror_rate = float(packet.get(\"serror_rate\", 0.0))\n    same_srv_rate = float(packet.get(\"same_srv_rate\", 1.0))\n    dst_host_count = int(packet.get(\"dst_host_count\", 1))\n    dst_host_srv_count = int(packet.get(\"dst_host_srv_count\", 1))\n\n    df_single = pd.DataFrame([{\n        \"duration\": duration,\n        \"protocol_type\": proto,\n        \"service\": srv,\n        \"flag\": flag,\n        \"src_bytes\": src_bytes,\n        \"dst_bytes\": dst_bytes,\n        \"count\": count,\n        \"srv_count\": srv_count,\n        \"serror_rate\": serror_rate,\n        \"same_srv_rate\": same_srv_rate,\n        \"dst_host_count\": dst_host_count,\n        \"dst_host_srv_count\": dst_host_srv_count\n    }])\n\n    # Preprocess feature vector\n    X_matrix, aligned_feature_names = preprocess_features(df_single, trained_feature_names=feature_names)\n\n    # Live Random Forest inference\n    pred = model.predict(X_matrix)[0]\n    proba = model.predict_proba(X_matrix)[0]\n    classes_list = list(model.classes_)\n    malicious_idx = classes_list.index(\"Malicious\") if \"Malicious\" in classes_list else 1\n    normal_idx = classes_list.index(\"Normal\") if \"Normal\" in classes_list else 0\n\n    is_malicious = (pred == \"Malicious\")\n    malicious_proba = float(proba[malicious_idx])\n    normal_proba = float(proba[normal_idx])\n\n    if is_malicious:\n        confidence = round(malicious_proba * 100, 1)\n        verdict = \"\ud83d\udd34 MALICIOUS DETECTED\"\n    else:\n        confidence = round(normal_proba * 100, 1)\n        verdict = \"\ud83d\udfe2 NORMAL TRAFFIC\"\n\n    # Threat classification & severity mapping\n    if is_malicious:\n        if srv in [\"ssh\", \"ftp\", \"telnet\"]:\n            threat_cat = \"Unauthorized Access (SSH Brute Force)\"\n            severity = \"Critical\"\n            mitigation_text = f\"Terminate active session and enforce IP blocklist on {src_ip}.\"\n        elif flag in [\"REJ\", \"RSTO\"] or same_srv_rate <= 0.25 or (dst_host_count >= 200 and srv_count <= 10):\n            threat_cat = \"PortScan / Network Probe\"\n            severity = \"High\"\n            mitigation_text = f\"Block scanner source IP {src_ip} at border gateway.\"\n        elif count >= 100 or serror_rate >= 0.5 or flag == \"S0\":\n            threat_cat = \"DoS Attack (SYN Flood)\"\n            severity = \"Critical\"\n            mitigation_text = f\"Apply iptables SYN rate-limit & drop traffic from {src_ip}.\"\n        else:\n            threat_cat = \"Malicious Incursion (Anomaly)\"\n            severity = \"High\"\n            mitigation_text = f\"Drop connection and blacklist {src_ip}.\"\n    else:\n        threat_cat = \"Normal Web Traffic\"\n        severity = \"None\"\n        mitigation_text = \"Traffic legitimate; no mitigation required.\"\n\n    # Protocol & Flag Explanations\n    proto_info = PROTOCOL_EXPLANATIONS.get(proto, {\n        \"name\": f\"{proto.upper()} Protocol\",\n        \"summary\": \"Standard network layer transport protocol.\",\n        \"details\": \"Handles end-to-end packet transport between client socket and host service.\"\n    })\n\n    flag_info = FLAG_EXPLANATIONS.get(flag, {\n        \"name\": f\"Flag {flag}\",\n        \"meaning\": \"Non-standard TCP control flag state.\",\n        \"security_context\": \"Evaluated in conjunction with connection count and payload distributions.\"\n    })\n\n    # AI Decision Rationale formulation\n    if is_malicious:\n        if threat_cat == \"DoS Attack (SYN Flood)\":\n            rationale = (\n                f\"The Random Forest model classified this traffic as **MALICIOUS (DoS SYN Flood)** with **{confidence}% confidence**. \"\n                f\"The key decision triggers include: connection flag is **{flag}** (half-open unacknowledged connection), \"\n                f\"unusually high connection rate (`count = {count}`, `srv_count = {srv_count}`), and an elevated SYN error rate (`serror_rate = {serror_rate}`). \"\n                f\"Combined with zero response payload (`dst_bytes = {dst_bytes}`), this perfectly matches the signature of an intentional connection table exhaustion attack.\"\n            )\n        elif threat_cat == \"PortScan / Network Probe\":\n            rationale = (\n                f\"The Random Forest model classified this packet as **MALICIOUS (PortScan / Network Probe)** with **{confidence}% confidence**. \"\n                f\"Key decision drivers: TCP flag is **{flag}** ({flag_info['name']}), accompanied by elevated destination host saturation \"\n                f\"(`dst_host_count = {dst_host_count}`) and very low same-service rate (`same_srv_rate = {same_srv_rate}`). \"\n                f\"This behavioral pattern indicates automated reconnaissance probing across multiple sockets.\"\n            )\n        else:\n            rationale = (\n                f\"The Random Forest model classified this packet as **MALICIOUS ({threat_cat})** with **{confidence}% confidence**. \"\n                f\"Targeted service '{srv}' received rapid repeated access requests (`count = {count}`) with flag **{flag}** and \"\n                f\"minimal payload balance (`src_bytes = {src_bytes}`, `dst_bytes = {dst_bytes}`), triggering anomaly splits in the tree ensemble.\"\n            )\n    else:\n        rationale = (\n            f\"The Random Forest model classified this packet as **NORMAL TRAFFIC** with **{confidence}% confidence**. \"\n            f\"The packet exhibits healthy connection mechanics: established connection flag **{flag}** (clean handshake completion), \"\n            f\"balanced bidirectional payload exchange (`src_bytes = {src_bytes}` B, `dst_bytes = {dst_bytes}` B), \"\n            f\"low error frequency (`serror_rate = {serror_rate}`), and normal connection rates (`count = {count}`).\"\n        )\n\n    # Actionable Firewall Mitigation Commands\n    if is_malicious:\n        firewall_commands = (\n            f\"# ========================================================\\n\"\n            f\"# SOC AUTOMATED MITIGATION PLAYBOOK - THREAT: {threat_cat.upper()}\\n\"\n            f\"# Attacker IP: {src_ip} | Target: {dst_ip} | Proto: {proto.upper()} | Port/Srv: {srv}\\n\"\n            f\"# ========================================================\\n\"\n            f\"# 1. Immediately drop all incoming traffic from malicious source IP:\\n\"\n            f\"iptables -A INPUT -s {src_ip} -j DROP\\n\\n\"\n            f\"# 2. Rate-limit incoming {proto.upper()} connection attempts on target service '{srv}':\\n\"\n            f\"iptables -A INPUT -p {proto} --dport {'80' if srv=='http' else '22' if srv=='ssh' else '8080'} -m limit --limit 25/minute --limit-burst 100 -j ACCEPT\\n\\n\"\n            f\"# 3. Drop invalid TCP flag combinations and half-open SYN packets:\\n\"\n            f\"iptables -A INPUT -p tcp --tcp-flags ALL NONE -j DROP\\n\"\n            f\"iptables -A INPUT -p tcp --tcp-flags SYN,ACK SYN,ACK -m state --state NEW -j DROP\\n\\n\"\n            f\"# 4. Log security incident event to syslog / SIEM collector:\\n\"\n            f\"iptables -A INPUT -s {src_ip} -j LOG --log-prefix \\\"NIDS_ALERT_{severity.upper()}: \\\" --log-level 4\"\n        )\n    else:\n        firewall_commands = (\n            f\"# ========================================================\\n\"\n            f\"# SOC STATEFUL FIREWALL POLICY - VERDICT: VERIFIED LEGITIMATE\\n\"\n            f\"# Source: {src_ip} | Destination: {dst_ip} | Service: {srv}\\n\"\n            f\"# ========================================================\\n\"\n            f\"# Traffic verified legitimate ({confidence}% normal confidence).\\n\"\n            f\"# Allow established and related return traffic:\\n\"\n            f\"iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT\\n\"\n            f\"iptables -A INPUT -p {proto} -s {src_ip} --dport {'80' if srv=='http' else '443'} -j ACCEPT\"\n        )\n\n    incident_id = f\"INC-{datetime.datetime.now().strftime('%Y%m%d')}-{random.randint(1000, 9999)}\"\n\n    return {\n        \"incident_id\": incident_id,\n        \"timestamp\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\"),\n        \"verdict\": verdict,\n        \"is_malicious\": is_malicious,\n        \"threat_category\": threat_cat,\n        \"severity\": severity,\n        \"confidence\": confidence,\n        \"malicious_proba\": round(malicious_proba * 100, 1),\n        \"normal_proba\": round(normal_proba * 100, 1),\n        \"packet_features\": {\n            \"src_ip\": src_ip,\n            \"dst_ip\": dst_ip,\n            \"protocol_type\": proto,\n            \"service\": srv,\n            \"flag\": flag,\n            \"duration\": duration,\n            \"src_bytes\": src_bytes,\n            \"dst_bytes\": dst_bytes,\n            \"count\": count,\n            \"srv_count\": srv_count,\n            \"serror_rate\": serror_rate,\n            \"same_srv_rate\": same_srv_rate,\n            \"dst_host_count\": dst_host_count,\n            \"dst_host_srv_count\": dst_host_srv_count\n        },\n        \"encoded_vector_shape\": f\"(1, {X_matrix.shape[1]})\",\n        \"encoded_features_sample\": dict(zip(aligned_feature_names[:8], [round(float(v), 2) for v in X_matrix[0][:8]])),\n        \"protocol_info\": proto_info,\n        \"flag_info\": flag_info,\n        \"rationale\": rationale,\n        \"mitigation_text\": mitigation_text,\n        \"firewall_commands\": firewall_commands\n    }\n\n", "data_manager.py": "\"\"\"\ndata_manager.py - SQLite Persistence & Data Management Layer\nAI-Based Network Intrusion Detection System\n\nImplements structured, persistent local storage using SQLite for:\n1. User Authentication & Role-Based Access Control (RBAC)\n2. Network Traffic Scan History\n3. Security Incident Alerts\n4. System Configuration & Audit Logs\n\nEnsures safe SQL transactions, parameterization against injection,\nand automatic schema creation without data loss across application reruns.\n\"\"\"\n\nimport sqlite3\nimport json\nimport os\nimport sys\nimport datetime\nimport hashlib\nfrom typing import List, Dict, Any, Optional\n\nDB_FILE = os.path.join(os.path.dirname(__file__) if \"__file__\" in globals() else os.getcwd(), \"nids_platform.db\")\n\n# ------------------------------------------------------------------------------\n# WEB-ASSEMBLY & IN-MEMORY FALLBACK STORAGE ENGINE\n# ------------------------------------------------------------------------------\n_SHARED_MEM_CONN: Optional[sqlite3.Connection] = None\n_USE_FALLBACK_STORE: bool = False\n\n_FALLBACK_STORE: Dict[str, List[Dict[str, Any]]] = {\n    \"users\": [\n        {\n            \"id\": 1,\n            \"username\": \"admin\",\n            \"password_hash\": hashlib.sha256(\"admin123\".encode(\"utf-8\")).hexdigest(),\n            \"role\": \"SOC Admin\",\n            \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        },\n        {\n            \"id\": 2,\n            \"username\": \"analyst\",\n            \"password_hash\": hashlib.sha256(\"analyst123\".encode(\"utf-8\")).hexdigest(),\n            \"role\": \"SOC Analyst\",\n            \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        },\n        {\n            \"id\": 3,\n            \"username\": \"engineer\",\n            \"password_hash\": hashlib.sha256(\"nids2026\".encode(\"utf-8\")).hexdigest(),\n            \"role\": \"Security Engineer\",\n            \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        },\n        {\n            \"id\": 4,\n            \"username\": \"examiner\",\n            \"password_hash\": hashlib.sha256(\"viva2026\".encode(\"utf-8\")).hexdigest(),\n            \"role\": \"Viva Examiner\",\n            \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        },\n        {\n            \"id\": 5,\n            \"username\": \"divi\",\n            \"password_hash\": hashlib.sha256(\"admin123\".encode(\"utf-8\")).hexdigest(),\n            \"role\": \"SOC Admin\",\n            \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        }\n    ],\n    \"scan_history\": [],\n    \"security_alerts\": [],\n    \"booking_requests\": [],\n    \"saved_itineraries\": [],\n    \"user_feedback\": []\n}\n\nclass _SafeConnectionWrapper:\n    \"\"\"Wrapper around an in-memory SQLite connection preventing .close() from discarding session data.\"\"\"\n    def __init__(self, conn: sqlite3.Connection):\n        self._conn = conn\n\n    def cursor(self):\n        return self._conn.cursor()\n\n    def commit(self):\n        try:\n            return self._conn.commit()\n        except Exception:\n            pass\n\n    def rollback(self):\n        try:\n            return self._conn.rollback()\n        except Exception:\n            pass\n\n    def execute(self, *args, **kwargs):\n        return self._conn.execute(*args, **kwargs)\n\n    def executemany(self, *args, **kwargs):\n        return self._conn.executemany(*args, **kwargs)\n\n    def close(self):\n        # In-memory persistence: do not terminate connection to preserve tables during browser session\n        pass\n\n    @property\n    def row_factory(self):\n        return self._conn.row_factory\n\n    @row_factory.setter\n    def row_factory(self, val):\n        self._conn.row_factory = val\n\n    def __enter__(self):\n        return self\n\n    def __exit__(self, *args):\n        pass\n\ndef _create_schema_on_conn(conn: Any):\n    \"\"\"Creates the standard NIDS schema on the provided SQLite connection.\"\"\"\n    cursor = conn.cursor()\n    cursor.execute(\"\"\"\n    CREATE TABLE IF NOT EXISTS users (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        username TEXT UNIQUE NOT NULL,\n        password_hash TEXT NOT NULL,\n        role TEXT NOT NULL DEFAULT 'SOC Analyst',\n        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n    );\n    \"\"\")\n    cursor.execute(\"\"\"\n    CREATE TABLE IF NOT EXISTS scan_history (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        scan_ref TEXT UNIQUE NOT NULL,\n        scan_date TEXT NOT NULL,\n        total_packets INTEGER NOT NULL,\n        normal_count INTEGER NOT NULL,\n        malicious_count INTEGER NOT NULL,\n        anomaly_rate REAL NOT NULL,\n        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n    );\n    \"\"\")\n    cursor.execute(\"\"\"\n    CREATE TABLE IF NOT EXISTS security_alerts (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        alert_ref TEXT NOT NULL,\n        scan_ref TEXT NOT NULL,\n        timestamp TEXT NOT NULL,\n        source_ip TEXT NOT NULL,\n        dest_ip TEXT NOT NULL,\n        protocol TEXT NOT NULL,\n        threat_type TEXT NOT NULL,\n        severity TEXT NOT NULL,\n        alert_message TEXT NOT NULL,\n        status TEXT NOT NULL DEFAULT 'Active',\n        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n    );\n    \"\"\")\n    cursor.execute(\"\"\"\n    CREATE TABLE IF NOT EXISTS booking_requests (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        ref_code TEXT UNIQUE NOT NULL,\n        guide_id TEXT NOT NULL,\n        guide_name TEXT NOT NULL,\n        traveler_name TEXT NOT NULL,\n        traveler_email TEXT NOT NULL,\n        traveler_phone TEXT NOT NULL,\n        tour_date TEXT NOT NULL,\n        party_size INTEGER NOT NULL,\n        tour_notes TEXT,\n        daily_fee INTEGER NOT NULL,\n        city TEXT NOT NULL,\n        status TEXT NOT NULL DEFAULT 'Confirmed (Demo)',\n        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n    );\n    \"\"\")\n    cursor.execute(\"\"\"\n    CREATE TABLE IF NOT EXISTS saved_itineraries (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        itinerary_ref TEXT UNIQUE NOT NULL,\n        destination_id TEXT NOT NULL,\n        destination_name TEXT NOT NULL,\n        duration_days INTEGER NOT NULL,\n        travelers_count INTEGER NOT NULL,\n        total_budget REAL NOT NULL,\n        estimated_cost REAL NOT NULL,\n        variance REAL NOT NULL,\n        budget_status TEXT NOT NULL,\n        travel_pace TEXT NOT NULL,\n        itinerary_data_json TEXT NOT NULL,\n        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n    );\n    \"\"\")\n    cursor.execute(\"\"\"\n    CREATE TABLE IF NOT EXISTS user_feedback (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        module_name TEXT NOT NULL,\n        rating INTEGER NOT NULL,\n        comments TEXT,\n        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n    );\n    \"\"\")\n    conn.commit()\n\ndef get_db_connection():\n    \"\"\"\n    Creates a thread-safe connection to the SQLite database.\n    If running in a WebAssembly, Pyodide, or restricted browser filesystem,\n    it falls back smoothly to a persistent in-memory SQLite connection.\n    \"\"\"\n    global _SHARED_MEM_CONN, _USE_FALLBACK_STORE\n\n    # If in-memory connection is already established, reuse it\n    if _SHARED_MEM_CONN is not None:\n        return _SafeConnectionWrapper(_SHARED_MEM_CONN)\n\n    try:\n        conn = sqlite3.connect(DB_FILE, check_same_thread=False)\n        conn.row_factory = sqlite3.Row\n        # Quick validation check to confirm write/read viability\n        conn.execute(\"SELECT 1;\")\n        return conn\n    except Exception as e:\n        # Gracefully switch to persistent in-memory database\n        try:\n            if _SHARED_MEM_CONN is None:\n                _SHARED_MEM_CONN = sqlite3.connect(\":memory:\", check_same_thread=False)\n                _SHARED_MEM_CONN.row_factory = sqlite3.Row\n                _create_schema_on_conn(_SHARED_MEM_CONN)\n            return _SafeConnectionWrapper(_SHARED_MEM_CONN)\n        except Exception:\n            _USE_FALLBACK_STORE = True\n            raise\n\ndef hash_password(password: str) -> str:\n    \"\"\"Generates a secure SHA-256 hash for password storage and verification.\"\"\"\n    return hashlib.sha256(password.encode(\"utf-8\")).hexdigest()\n\ndef init_db():\n    \"\"\"Initializes the database schema if tables do not exist.\"\"\"\n    global _USE_FALLBACK_STORE\n    try:\n        conn = get_db_connection()\n        _create_schema_on_conn(conn)\n        conn.close()\n    except Exception as e:\n        _USE_FALLBACK_STORE = True\n\n    # Seed default demo accounts on launch\n    try:\n        seed_default_admin()\n    except Exception:\n        pass\n\n# ------------------------------------------------------------------------------\n# BOOKING REQUEST OPERATIONS\n# ------------------------------------------------------------------------------\n\ndef save_booking_request(\n    ref_code: str,\n    guide_id: str,\n    guide_name: str,\n    traveler_name: str,\n    traveler_email: str,\n    traveler_phone: str,\n    tour_date: str,\n    party_size: int,\n    tour_notes: str,\n    daily_fee: int,\n    city: str\n) -> bool:\n    \"\"\"Inserts a new verified demonstration booking record into SQLite or fallback store.\"\"\"\n    rec = {\n        \"id\": len(_FALLBACK_STORE[\"booking_requests\"]) + 1,\n        \"ref_code\": ref_code,\n        \"guide_id\": guide_id,\n        \"guide_name\": guide_name,\n        \"traveler_name\": traveler_name.strip(),\n        \"traveler_email\": traveler_email.strip(),\n        \"traveler_phone\": traveler_phone.strip(),\n        \"tour_date\": str(tour_date),\n        \"party_size\": int(party_size),\n        \"tour_notes\": tour_notes.strip() if tour_notes else \"\",\n        \"daily_fee\": int(daily_fee),\n        \"city\": city,\n        \"status\": \"Confirmed (Demo)\",\n        \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n    }\n    _FALLBACK_STORE[\"booking_requests\"].insert(0, rec)\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        INSERT INTO booking_requests \n        (ref_code, guide_id, guide_name, traveler_name, traveler_email, traveler_phone, tour_date, party_size, tour_notes, daily_fee, city)\n        VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n        \"\"\", (\n            ref_code, guide_id, guide_name, traveler_name.strip(),\n            traveler_email.strip(), traveler_phone.strip(), str(tour_date),\n            int(party_size), tour_notes.strip() if tour_notes else \"\",\n            int(daily_fee), city\n        ))\n        conn.commit()\n        conn.close()\n        return True\n    except Exception as e:\n        return True\n\ndef get_all_booking_requests(limit: int = 50) -> List[Dict[str, Any]]:\n    \"\"\"Retrieves recorded demonstration bookings ordered by newest first.\"\"\"\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        SELECT * FROM booking_requests ORDER BY id DESC LIMIT ?\n        \"\"\", (limit,))\n        rows = cursor.fetchall()\n        results = [dict(row) for row in rows]\n        conn.close()\n        if results:\n            return results\n    except Exception:\n        pass\n    return _FALLBACK_STORE[\"booking_requests\"][:limit]\n\n# ------------------------------------------------------------------------------\n# ITINERARY PERSISTENCE OPERATIONS\n# ------------------------------------------------------------------------------\n\ndef save_itinerary(\n    itinerary_ref: str,\n    destination_id: str,\n    destination_name: str,\n    duration_days: int,\n    travelers_count: int,\n    total_budget: float,\n    estimated_cost: float,\n    variance: float,\n    budget_status: str,\n    travel_pace: str,\n    itinerary_data: Dict[str, Any]\n) -> bool:\n    \"\"\"Saves a generated itinerary for persistence across sessions.\"\"\"\n    rec = {\n        \"id\": len(_FALLBACK_STORE[\"saved_itineraries\"]) + 1,\n        \"itinerary_ref\": itinerary_ref,\n        \"destination_id\": destination_id,\n        \"destination_name\": destination_name,\n        \"duration_days\": int(duration_days),\n        \"travelers_count\": int(travelers_count),\n        \"total_budget\": float(total_budget),\n        \"estimated_cost\": float(estimated_cost),\n        \"variance\": float(variance),\n        \"budget_status\": budget_status,\n        \"travel_pace\": travel_pace,\n        \"itinerary_data_json\": json.dumps(itinerary_data),\n        \"created_at\": datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n    }\n    _FALLBACK_STORE[\"saved_itineraries\"] = [i for i in _FALLBACK_STORE[\"saved_itineraries\"] if i[\"itinerary_ref\"] != itinerary_ref]\n    _FALLBACK_STORE[\"saved_itineraries\"].insert(0, rec)\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        INSERT OR REPLACE INTO saved_itineraries\n        (itinerary_ref, destination_id, destination_name, duration_days, travelers_count, total_budget, estimated_cost, variance, budget_status, travel_pace, itinerary_data_json)\n        VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n        \"\"\", (\n            itinerary_ref, destination_id, destination_name, int(duration_days),\n            int(travelers_count), float(total_budget), float(estimated_cost),\n            float(variance), budget_status, travel_pace, json.dumps(itinerary_data)\n        ))\n        conn.commit()\n        conn.close()\n        return True\n    except Exception as e:\n        return True\n\ndef get_saved_itineraries(limit: int = 20) -> List[Dict[str, Any]]:\n    \"\"\"Retrieves saved itineraries from SQLite or fallback store.\"\"\"\n    try:\n        conn = get_db_connection()\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n        SELECT id, itinerary_ref, destination_id, destination_name, duration_days, travelers_count, total_budget, estimated_cost, variance, budget_status, travel_pace, created_at \n        FROM saved_itineraries ORDER BY id DESC LIMIT ?\n        \"\"\", (limit,))\n        rows = cursor.fetchall()\n        results = [dict(row) for row in rows]\n        conn.close()\n        if results:\n            return results\n    except Exception:\n        pass\n    return _FALLBACK_STORE[\"saved_itineraries\"][:limit]\n\n# ------------------------------------------------------------------------------\n# FE
